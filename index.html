<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Control de Barriles · Pimasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="preconnect" href="https://identitytoolkit.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Inter:ital@1&display=swap" rel="stylesheet">
<style>
  :root{
    --graphite-950:#12161a;
    --graphite-900:#191f23;
    --graphite-800:#212830;
    --graphite-700:#2b333c;
    --steel-line:#3a434c;
    --paper:#f2eee2;
    --paper-2:#e9e3d1;
    --paper-line:#d9d0b8;
    --ink:#211d16;
    --ink-soft:#5b5548;
    --green:#12724f;
    --green-deep:#0b4d36;
    --green-glow:#1c9a6c;
    --amber:#c9822e;
    --danger:#b1503c;
    --text-soft:#cfd5d8;
    --text-dim:#8b959c;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--graphite-950);
    color:var(--text-soft);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- top bar ---------- */
  .topbar{
    background:linear-gradient(180deg,var(--graphite-900),var(--graphite-950));
    border-bottom:1px solid var(--steel-line);
    padding:18px 22px 0 22px;
  }
  .brand-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:38px;height:38px;border-radius:50%;
    border:2.5px solid var(--green-glow);
    display:flex;align-items:center;justify-content:center;
    position:relative;flex-shrink:0;
  }
  .brand-mark::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--green-glow);}
  .brand-mark::before{content:'';position:absolute;width:1.5px;height:11px;background:var(--green-glow);top:5px;left:50%;transform-origin:bottom center;transform:translateX(-50%) rotate(35deg);}
  .brand-text h1{font-family:'Oswald',sans-serif;font-size:19px;letter-spacing:.03em;margin:0;color:#fff;text-transform:uppercase;font-weight:600;}
  .brand-text p{margin:1px 0 0;font-size:11.5px;color:var(--text-dim);letter-spacing:.02em;}
  .status-pill{
    display:flex;align-items:center;gap:7px;
    background:var(--graphite-800);border:1px solid var(--steel-line);
    padding:6px 12px;border-radius:20px;font-size:11.5px;color:var(--text-dim);
  }
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--green-glow);box-shadow:0 0 8px var(--green-glow);animation:pulse 2.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  @media (prefers-reduced-motion:reduce){.status-dot{animation:none;}}

  .tabs{display:flex;gap:2px;overflow-x:auto;}
  .tab{
    font-family:'Oswald',sans-serif;
    font-size:12.5px;letter-spacing:.03em;text-transform:uppercase;
    color:var(--text-dim);background:transparent;border:none;
    padding:11px 16px;cursor:pointer;white-space:nowrap;
    border-bottom:2.5px solid transparent;display:flex;align-items:center;gap:8px;
    transition:color .15s;
  }
  .tab .step{
    font-size:10px;color:var(--graphite-950);background:var(--text-dim);
    width:16px;height:16px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:600;
  }
  .tab.active{color:#fff;border-bottom-color:var(--green-glow);}
  .tab.active .step{background:var(--green-glow);}
  .tab:hover{color:#fff;}

  main{flex:1;padding:26px 22px 60px;max-width:1180px;width:100%;margin:0 auto;}

  /* ---------- generic ---------- */
  h2.view-title{font-family:'Oswald',sans-serif;color:#fff;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;font-weight:600;}
  .view-sub{color:var(--text-dim);font-size:13px;margin:0 0 22px;}
  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    border-radius:7px;border:1px solid transparent;padding:10px 16px;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:filter .12s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--green);color:#fff;}
  .btn-primary:hover{filter:brightness(1.12);}
  .btn-ghost{background:transparent;border-color:var(--steel-line);color:var(--text-soft);}
  .btn-ghost:hover{border-color:var(--text-dim);color:#fff;}
  .btn-danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-sm{padding:6px 11px;font-size:12px;}

  /* ---------- dashboard ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
  .kpi-card{
    background:var(--graphite-800);border:1px solid var(--steel-line);border-radius:var(--radius);
    padding:16px 16px 14px;
  }
  .kpi-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);margin:0 0 8px;}
  .kpi-value{font-family:'Oswald',sans-serif;font-size:28px;color:#fff;font-weight:600;font-variant-numeric:tabular-nums;}
  .kpi-value small{font-size:13px;color:var(--text-dim);font-family:'Inter';}

  .dash-grid{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start;}
  @media (max-width:760px){.dash-grid{grid-template-columns:1fr;}}

  .gauge-card{
    background:var(--graphite-800);border:1px solid var(--steel-line);border-radius:var(--radius);
    padding:20px;text-align:center;
  }
  .gauge-card h3{font-family:'Oswald';font-size:12.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px;font-weight:500;}
  .gauge-pct{font-family:'Oswald';font-size:34px;color:#fff;margin-top:6px;font-weight:600;}
  .gauge-note{font-size:11.5px;color:var(--text-dim);margin-top:4px;}

  .activity-card{background:var(--graphite-800);border:1px solid var(--steel-line);border-radius:var(--radius);padding:6px 0;}
  .activity-card h3{font-family:'Oswald';font-size:12.5px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin:0;padding:14px 18px 10px;font-weight:500;border-bottom:1px solid var(--steel-line);}
  .activity-row{display:flex;align-items:center;justify-content:space-between;padding:11px 18px;border-bottom:1px solid var(--graphite-700);font-size:13px;}
  .activity-row:last-child{border-bottom:none;}
  .activity-tag{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--green-glow);font-weight:700;}
  .activity-meta{color:var(--text-dim);font-size:12px;}
  .empty-note{padding:24px 18px;color:var(--text-dim);font-size:13px;}

  /* ---------- lists of partes ---------- */
  .list-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .parte-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
  .parte-card{
    background:var(--paper);color:var(--ink);border-radius:var(--radius);
    padding:15px 16px;cursor:pointer;border:1px solid var(--paper-line);
    position:relative;transition:transform .1s, box-shadow .15s;
  }
  .parte-card:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.35);}
  .parte-card::before{
    content:'';position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--green);
  }
  .parte-card .pc-code{font-family:'Oswald';font-weight:600;font-size:15px;letter-spacing:.01em;}
  .parte-card .pc-date{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .parte-card .pc-stats{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--ink-soft);}
  .parte-card .pc-stats b{color:var(--ink);font-family:'Inter';font-variant-numeric:tabular-nums;}
  .new-parte-card{
    border:1.5px dashed var(--steel-line);border-radius:var(--radius);
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
    color:var(--text-dim);cursor:pointer;min-height:96px;font-size:12.5px;background:transparent;
    transition:border-color .15s, color .15s;
  }
  .new-parte-card:hover{border-color:var(--green-glow);color:#fff;}
  .new-parte-card .plus{font-size:22px;line-height:1;color:var(--green-glow);}

  /* ---------- editor ---------- */
  .editor-header{
    background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:18px;margin-bottom:18px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;
  }
  .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:4px;}
  .field input{
    width:100%;border:1px solid var(--paper-line);background:#fff;border-radius:6px;
    padding:8px 9px;font-size:13.5px;color:var(--ink);font-family:'Inter';
  }
  .field input:focus{outline:2px solid var(--green);outline-offset:1px;}

  .table-wrap{background:var(--paper);border-radius:var(--radius);overflow-x:auto;margin-bottom:16px;}
  table.parte-table{border-collapse:collapse;width:100%;min-width:640px;color:var(--ink);}
  table.parte-table th, table.parte-table td{border:1px solid var(--paper-line);padding:0;}
  table.parte-table thead th{
    background:var(--paper-2);font-family:'Oswald';font-size:11px;text-transform:uppercase;
    letter-spacing:.03em;color:var(--ink-soft);padding:9px 8px;font-weight:500;text-align:center;
  }
  table.parte-table thead th.concept-col{text-align:left;min-width:230px;}
  table.parte-table td.concept-cell{padding:8px 10px;font-size:13px;font-weight:500;background:var(--paper-2);}
  table.parte-table td.code-cell{padding:8px 6px;font-size:11px;color:var(--ink-soft);text-align:center;background:var(--paper-2);font-variant-numeric:tabular-nums;}
  table.parte-table td.val-cell{padding:0;text-align:center;}
  table.parte-table td.val-cell input{
    width:100%;height:100%;min-height:34px;border:none;background:transparent;text-align:center;
    font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink);padding:6px 4px;
  }
  table.parte-table td.val-cell input:focus{outline:2px solid var(--green);outline-offset:-2px;background:#fff;}
  table.parte-table td.total-cell{font-weight:700;background:#e3ddc8;font-variant-numeric:tabular-nums;padding:8px 6px;text-align:center;}
  table.parte-table tr.total-row td{background:var(--green);color:#fff;font-weight:700;}
  table.parte-table tr.total-row td.concept-cell{background:var(--green-deep);color:#fff;}
  .col-head-inner{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .col-head-inner input[type=date]{border:1px solid var(--paper-line);border-radius:4px;font-size:11px;padding:2px 3px;font-family:'Inter';}
  .col-del{background:none;border:none;color:var(--danger);cursor:pointer;font-size:14px;line-height:1;padding:0;}

  .editor-actions{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:6px;}
  .save-note{font-size:11.5px;color:var(--text-dim);align-self:center;}

  /* ---------- export ---------- */
  .export-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:20px;}
  .export-card{background:var(--graphite-800);border:1px solid var(--steel-line);border-radius:var(--radius);padding:18px;}
  .export-card h3{font-family:'Oswald';font-size:14.5px;color:#fff;margin:0 0 4px;text-transform:uppercase;letter-spacing:.02em;}
  .export-card p{font-size:12.5px;color:var(--text-dim);margin:0 0 14px;line-height:1.5;}
  .info-box{
    background:var(--graphite-800);border:1px solid var(--steel-line);border-left:3px solid var(--green-glow);
    border-radius:8px;padding:14px 16px;font-size:12.5px;color:var(--text-soft);line-height:1.6;
  }
  .info-box b{color:#fff;}

  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--steel-line);border-radius:4px;}

  /* ---------- login ---------- */
  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{
    background:var(--paper);color:var(--ink);border-radius:14px;padding:34px 32px;width:100%;max-width:340px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);border:1px solid var(--paper-line);
  }
  .login-mark{width:52px;height:52px;border-radius:50%;border:3px solid var(--green);margin:0 auto 16px;position:relative;}
  .login-mark::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:var(--green);top:50%;left:50%;transform:translate(-50%,-50%);}
  .login-mark::before{content:'';position:absolute;width:2px;height:15px;background:var(--green);top:8px;left:50%;transform-origin:bottom center;transform:translateX(-50%) rotate(35deg);}
  .login-card h2{font-family:'Oswald';text-transform:uppercase;text-align:center;font-size:17px;letter-spacing:.03em;margin:0 0 4px;}
  .login-card p.sub{text-align:center;font-size:12px;color:var(--ink-soft);margin:0 0 22px;}
  .login-card .field{margin-bottom:14px;}
  .login-card label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:5px;}
  .login-card input{width:100%;border:1px solid var(--paper-line);background:#fff;border-radius:6px;padding:10px 11px;font-size:14px;font-family:'Inter';}
  .login-card input:focus{outline:2px solid var(--green);outline-offset:1px;}
  .login-card button{width:100%;margin-top:6px;justify-content:center;}
  .login-error{background:#f4dfd8;color:var(--danger);border-radius:6px;padding:8px 10px;font-size:12px;margin-bottom:12px;display:none;}
  .login-error.show{display:block;}

  /* ---------- secondary nav (replaces tabs) ---------- */
  .subnav{display:flex;gap:16px;padding:10px 0 14px;align-items:center;}
  .subnav a{
    font-size:12px;color:var(--text-dim);cursor:pointer;text-decoration:none;
    display:flex;align-items:center;gap:5px;transition:color .15s;
  }
  .subnav a:hover, .subnav a.active{color:#fff;}
  .subnav .sep{width:1px;height:12px;background:var(--steel-line);}
  .subnav .logout{margin-left:auto;color:var(--danger);}
  .subnav .logout:hover{color:#e37a5f;}

  /* ---------- home access buttons ---------- */
  .access-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:22px 0 28px;}
  .access-card{
    background:var(--graphite-800);border:1px solid var(--steel-line);border-radius:var(--radius);
    padding:20px;cursor:pointer;text-align:left;transition:transform .1s,border-color .15s;position:relative;overflow:hidden;
  }
  .access-card:hover{transform:translateY(-2px);border-color:var(--green-glow);}
  .access-card .step-badge{
    font-family:'Oswald';font-size:11px;font-weight:600;color:var(--graphite-950);background:var(--green-glow);
    width:24px;height:24px;border-radius:5px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;
  }
  .access-card h3{font-family:'Oswald';font-size:16px;color:#fff;margin:0 0 4px;text-transform:uppercase;letter-spacing:.01em;}
  .access-card p{font-size:12px;color:var(--text-dim);margin:0;}
  .access-card .arrow{position:absolute;right:18px;top:18px;color:var(--text-dim);font-size:18px;}
</style>
</head>
<body>
<div id="app">
  <div class="login-wrap"><p style="color:#8b959c;">Cargando…</p></div>
</div>

<!-- Firebase se carga aquí (al final del body) para no bloquear el primer pintado -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
/* ============================= FIREBASE ============================= */
// Pega aquí la config de tu app web (Firebase Console > Configuración del
// proyecto > Tus apps > Web > SDK setup and configuration).
const firebaseConfig = {
  apiKey: "AIzaSyAyyBGtmNqrbB5k83nmJPGAkjuv7RHBcyY",
  authDomain: "barriles-ea58d.firebaseapp.com",
  projectId: "barriles-ea58d",
  storageBucket: "barriles-ea58d.firebasestorage.app",
  messagingSenderId: "420871542451",
  appId: "1:420871542451:web:b1caac1a33b8f7af8a82c6",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// Caché local: en la siguiente visita, la app puede pintar datos al instante
// desde el propio dispositivo mientras se sincroniza con el servidor de fondo.
db.enablePersistence({ synchronizeTabs: true }).catch(err=>{
  console.warn('Persistencia offline no disponible:', err.code);
});
const auth = firebase.auth();

// Las colecciones de Firestore, una por tipo de parte.
const COLLECTIONS = { rev1: 'partes_rev1', rep1: 'partes_rep1', rep2: 'partes_rep2' };

// El login pide "usuario" (p.ej. Admin) pero por debajo usa Firebase
// Authentication de verdad, con un email interno "usuario@pimasa.local".
// Crea este usuario una vez en Firebase Console > Authentication > Users.
function usernameToEmail(u){ return u.trim().toLowerCase().replace(/\s+/g,'') + '@pimasa.local'; }

/* ============================= DATA MODEL ============================= */
const REV1_CONCEPTS = [
  {name:"Barriles con etiqueta 50L Grundy", code:"46393"},
  {name:"Barriles con etiqueta 50L Sunkey", code:"46432"},
  {name:"Barriles con etiqueta 30L Sunkey", code:"46426"},
  {name:"Barriles con etiqueta 30L Grundy", code:"50426"},
  {name:"Barriles con tapa blanca 50L Grundy", code:"46393"},
  {name:"Barriles con tapa blanca 50L Sunkey", code:"46432"},
  {name:"Barriles con tapa blanca 30L Sunkey", code:"46426"},
  {name:"Barriles caducados 50L Grundy", code:"46393"},
  {name:"Barriles caducados 50L Sunkey", code:"46432"},
  {name:"Barriles caducados 30L Sunkey", code:"46426"},
  {name:"Barriles caducados 20L David", code:"46437"},
  {name:"Barriles caducados 30L Grundy", code:"50426"},
];

const REP1_CONCEPTS = ["Extraños","Disponibles","Cambio espadín nuevo Grundy","Cambio espadín reparado Grundy",
  "Cambio espadín nuevo Sanky","Cambio espadín reparado Sanky","Cambio espadín transformado",
  "Cambio junta espadín","Enderezado aros","Soldadura asas","Chatarra",
  "Vaciado 50L","Vaciado 30L","Vaciado 20L","Sin presión","Sin presión a 2ª reparación",
  "Con presión a 2ª reparación","Prueba estanqueidad espadín Grundy","Cambio palet","Sin seguros"];
const REP1_TOTAL_ROWS = ["Extraños","Disponibles","Cambio espadín nuevo Grundy","Cambio espadín reparado Grundy",
  "Cambio espadín nuevo Sanky","Cambio espadín reparado Sanky","Cambio espadín transformado",
  "Cambio junta espadín","Enderezado aros","Soldadura asas","Chatarra"];

const REP2_CONCEPTS = ["Cambio espadín reparado Grundy","Cambio espadín nuevo Grundy","Cambio espadín reparado Sanky",
  "Cambio espadín nuevo Sanky","Cambio espadín transformado","Cambio junta espadín","Chatarra",
  "Enderezado aros","Soldadura asas"];
const REP2_TOTAL_ROWS = ["Cambio espadín reparado Grundy","Cambio espadín nuevo Grundy","Cambio espadín reparado Sanky",
  "Cambio espadín nuevo Sanky","Cambio espadín transformado","Cambio junta espadín","Chatarra"];

const TYPES = {
  rev1: {key:'rev1', storageKey:'rev1-partes', label:'1ª Revisión', short:'Revisión', step:'01',
         concepts: REV1_CONCEPTS.map(c=>c.name), hasCode:true, codeMap: REV1_CONCEPTS,
         header:['fecha','palets','barriles'], totalRows:REV1_CONCEPTS.map(c=>c.name)},
  rep1: {key:'rep1', storageKey:'rep1-partes', label:'1ª Reparación', short:'Reparación 1', step:'02',
         concepts: REP1_CONCEPTS, hasCode:false,
         header:['fecha','codigo','descripcion','ubicacion','palets','barriles'], totalRows:REP1_TOTAL_ROWS},
  rep2: {key:'rep2', storageKey:'rep2-partes', label:'2ª Reparación (Enderezado)', short:'Reparación 2', step:'03',
         concepts: REP2_CONCEPTS, hasCode:false, totalAtEnd:true,
         header:['fecha','codigo','descripcion','ubicacion','palets','barriles'], totalRows:REP2_CONCEPTS},
};

const FIELD_LABELS = {fecha:'Fecha', palets:'Nº Palets', barriles:'Nº Barriles', codigo:'Código',
  descripcion:'Descripción', ubicacion:'Ubicación'};

let STATE = {
  authChecked:false,
  authenticated:false,
  view:'dashboard',       // dashboard | list | editor | export
  activeType:null,        // rev1 | rep1 | rep2
  activeParteId:null,
  data:{rev1:[], rep1:[], rep2:[]},
  loaded:false,
};

const saveTimers = {};      // un debounce por parte (clave = id del parte)
let pendingSaves = 0;       // nº de guardados en curso ahora mismo
let syncStatus = 'ok';      // 'ok' | 'saving' | 'error'
let unsubscribers = {};     // listeners de Firestore activos, por tipo
let loadedCollections = new Set();

/* ============================= FIRESTORE SYNC ============================= */
// Un listener en tiempo real por colección. Cada parte es su propio documento,
// así que un fallo puntual en un documento nunca borra el resto (a diferencia
// de guardar todo en un único blob).
function startListening(){
  loadedCollections = new Set();
  Object.entries(COLLECTIONS).forEach(([typeKey, colName])=>{
    unsubscribers[typeKey] = db.collection(colName).onSnapshot(snap=>{
      loadedCollections.add(typeKey);
      if(loadedCollections.size===3) STATE.loaded = true;
      // No pisamos el parte que se está editando activamente ahora mismo.
      if(STATE.view==='editor' && STATE.activeType===typeKey){
        setSyncStatus('ok');
        return;
      }
      const list = [];
      snap.forEach(doc=> list.push(Object.assign({id: doc.id}, doc.data())));
      STATE.data[typeKey] = list;
      setSyncStatus('ok');
      render();
    }, err=>{
      console.error('Error escuchando', typeKey, err);
      setSyncStatus('error');
    });
  });
}

function stopListening(){
  Object.values(unsubscribers).forEach(u=>{ if(u) u(); });
  unsubscribers = {};
  loadedCollections = new Set();
  STATE.loaded = false;
}

async function saveParte(typeKey, parte){
  pendingSaves++;
  setSyncStatus('saving');
  try{
    await db.collection(COLLECTIONS[typeKey]).doc(parte.id).set(parte);
    setSyncStatus('ok');
  }catch(e){
    console.error('Error guardando', typeKey, parte.id, e);
    setSyncStatus('error');
    setTimeout(()=>saveParte(typeKey, parte), 2000); // reintenta en vez de perder el dato
  }finally{
    pendingSaves = Math.max(0, pendingSaves-1);
  }
}

async function deleteParteRemote(typeKey, id){
  try{ await db.collection(COLLECTIONS[typeKey]).doc(id).delete(); }
  catch(e){ console.error('Error eliminando', typeKey, id, e); }
}

function scheduleSave(typeKey, parte){
  clearTimeout(saveTimers[parte.id]);
  saveTimers[parte.id] = setTimeout(()=>saveParte(typeKey, parte), 500);
}

// Guarda inmediatamente el parte que esté abierto, por si se cierra la
// pestaña o el navegador antes de que salte el debounce de 500ms.
function flushPendingSaves(){
  if(STATE.view==='editor'){
    const p = getParte(STATE.activeType, STATE.activeParteId);
    if(p){ clearTimeout(saveTimers[p.id]); saveTimers[p.id]=null; saveParte(STATE.activeType, p); }
  }
}

function setSyncStatus(status){
  syncStatus = status;
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-text');
  if(!dot || !text) return;
  if(status==='saving'){ text.textContent='Guardando…'; dot.style.background='#c9822e'; dot.style.boxShadow='0 0 8px #c9822e'; }
  else if(status==='error'){ text.textContent='Sin conexión, reintentando…'; dot.style.background='#b1503c'; dot.style.boxShadow='0 0 8px #b1503c'; }
  else { text.textContent='Datos compartidos en vivo'; dot.style.background=''; dot.style.boxShadow=''; }
}

/* ============================= HELPERS ============================= */
function uid(prefix){return prefix+'-'+Date.now()+'-'+Math.floor(Math.random()*1000);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y.slice(2)}`; }
function num(v){const n=parseFloat(v); return isNaN(n)?0:n;}

function getParte(typeKey, id){ return STATE.data[typeKey].find(p=>p.id===id); }

function rowTotal(parte, concept){
  let sum=0;
  for(const col of parte.cols){ sum += num(parte.values[concept] && parte.values[concept][col.id]); }
  return sum;
}
function colTotal(parte, colId, totalRows){
  let sum=0;
  const rows = totalRows || TYPES[STATE.activeType].concepts;
  for(const c of rows){ sum += num(parte.values[c] && parte.values[c][colId]); }
  return sum;
}
function parteGrandTotal(typeKey, parte){
  const conf = TYPES[typeKey];
  const rows = conf.totalRows || conf.concepts;
  let sum=0;
  for(const c of rows){ sum += rowTotal(parte, c); }
  return sum;
}

function newParte(typeKey){
  const conf = TYPES[typeKey];
  const p = {id:uid(typeKey), fecha:todayISO(), palets:'', barriles:'', codigo:'', descripcion:'', ubicacion:'',
             cols:[{id:uid('col'), fecha:todayISO()}], values:{}, updatedAt:Date.now()};
  conf.concepts.forEach(c=>p.values[c]={});
  return p;
}

}

function attachLoginHandlers(){
  const userEl = document.getElementById('login-user');
  const passEl = document.getElementById('login-pass');
  const errEl = document.getElementById('login-error');
  const btnEl = document.getElementById('login-btn');
  const doLogin = async ()=>{
    errEl.classList.remove('show');
    btnEl.textContent = 'Entrando…';
    try{
      await auth.signInWithEmailAndPassword(usernameToEmail(userEl.value), passEl.value);
      // onAuthStateChanged se encarga del resto (marca authenticated y arranca Firestore)

      errEl.classList.add('show');

  [userEl, passEl].forEach(el=> el.addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));

}

/* ============================= DASHBOARD ============================= */
function renderDashboard(){
  const today = todayISO();
  let barrilesHoy=0, chatarraTotal=0, disponiblesTotal=0, partesAbiertos=0;
  let recent=[];

  Object.values(TYPES).forEach(conf=>{
    STATE.data[conf.key].forEach(p=>{
      partesAbiertos++;
      p.cols.forEach(col=>{
        if(col.fecha===today){
          if(conf.key==='rev1'){
            REV1_CONCEPTS.forEach(c=>{ barrilesHoy += num(p.values[c.name] && p.values[c.name][col.id]); });
          } else {
            const rows = conf.totalRows;
            rows.forEach(c=>{ barrilesHoy += num(p.values[c] && p.values[c][col.id]); });
          }
        }
      });
      if(p.values['Chatarra']) Object.values(p.values['Chatarra']).forEach(v=>chatarraTotal+=num(v));
      if(p.values['Disponibles']) Object.values(p.values['Disponibles']).forEach(v=>disponiblesTotal+=num(v));
      recent.push({type:conf.key, label:conf.short, parte:p});
    });
  });

  recent.sort((a,b)=>(b.parte.updatedAt||0)-(a.parte.updatedAt||0));
  recent = recent.slice(0,6);

  const pct = (chatarraTotal+disponiblesTotal)>0 ? Math.round(100*chatarraTotal/(chatarraTotal+disponiblesTotal)) : 0;
  const angle = -90 + (pct/100)*180;

  return `
    <h2 class="view-title">Panel general</h2>
    <p class="view-sub">Vista en tiempo real de todos los partes registrados por el equipo.</p>

    <div class="access-grid">
      ${Object.values(TYPES).map(conf=>`
        <div class="access-card" data-nav="${conf.key}">
          <span class="arrow">→</span>
          <div class="step-badge">${conf.step}</div>
          <h3>${conf.label}</h3>
          <p>${STATE.data[conf.key].length} parte(s) registrados</p>
        </div>
      `).join('')}
    </div>

    <div class="kpi-grid">
      <div class="kpi-card"><p class="kpi-label">Barriles registrados hoy</p><div class="kpi-value">${barrilesHoy}</div></div>
      <div class="kpi-card"><p class="kpi-label">Partes abiertos</p><div class="kpi-value">${partesAbiertos}</div></div>
      <div class="kpi-card"><p class="kpi-label">Disponibles acumulados</p><div class="kpi-value">${disponiblesTotal}</div></div>
      <div class="kpi-card"><p class="kpi-label">Chatarra acumulada</p><div class="kpi-value">${chatarraTotal}</div></div>
    </div>

    <div class="dash-grid">
      <div class="gauge-card">
        <h3>Ratio de chatarra</h3>
        ${gaugeSVG(angle)}
        <div class="gauge-pct">${pct}%</div>
        <div class="gauge-note">chatarra sobre disponibles + chatarra</div>
      </div>
      <div class="activity-card">
        <h3>Última actividad</h3>
        ${recent.length? recent.map(r=>`
          <div class="activity-row">
            <div>
              <div class="activity-tag">${r.label}</div>
              <div>${r.parte.codigo || r.parte.id.split('-')[0]} · ${fmtDate(r.parte.fecha)}</div>
            </div>
            <div class="activity-meta">${r.parte.cols.length} columna(s)</div>
          </div>
        `).join('') : `<div class="empty-note">Todavía no hay partes registrados. Crea el primero desde una de las pestañas.</div>`}
      </div>
    </div>
  `;
}

function gaugeSVG(angleDeg){
  return `
  <svg width="150" height="90" viewBox="0 0 150 90">
    <path d="M15,80 A60,60 0 0 1 135,80" fill="none" stroke="#3a434c" stroke-width="10" stroke-linecap="round"/>
    <path d="M15,80 A60,60 0 0 1 135,80" fill="none" stroke="#1c9a6c" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="188.5" stroke-dashoffset="${188.5 - (188.5*(Math.min(Math.max(angleDeg+90,0),180)/180))}"/>
    <line x1="75" y1="80" x2="${75+50*Math.cos(angleDeg*Math.PI/180)}" y2="${80+50*Math.sin(angleDeg*Math.PI/180)}"
      stroke="#f2eee2" stroke-width="3" stroke-linecap="round"/>
    <circle cx="75" cy="80" r="5" fill="#f2eee2"/>
  </svg>`;
}

/* ============================= EDITOR ============================= */
function renderEditor(typeKey, parteId){
  const conf = TYPES[typeKey];
  const p = getParte(typeKey, parteId);
  if(!p) return `<p>Parte no encontrado.</p>`;

  const headerFields = conf.header.map(f=>{
    const type = f==='fecha' ? 'date' : (f==='palets'||f==='barriles' ? 'number' : 'text');
    return `
      <div class="field">
        <label>${FIELD_LABELS[f]}</label>
        <input type="${type}" data-field="${f}" value="${p[f]||''}" />
      </div>`;
  }).join('');

  const bodyRowsArr = conf.concepts.map((concept, idx)=>{
    const code = conf.hasCode ? conf.codeMap[idx].code : null;
    const cells = p.cols.map(col=>`
      <td class="val-cell"><input type="number" inputmode="numeric" data-cell="${concept}|${col.id}"
        value="${(p.values[concept] && p.values[concept][col.id]!==undefined) ? p.values[concept][col.id] : ''}" /></td>
    `).join('');
    return `
      <tr>
        <td class="concept-cell">${concept}</td>
        ${conf.hasCode? `<td class="code-cell">${code}</td>` : ''}
        ${cells}
        <td class="total-cell">${rowTotal(p, concept)}</td>
      </tr>`;
  });

  const totalRowHtml = `
    <tr class="total-row">
      <td class="concept-cell">TOTAL</td>
      ${conf.hasCode? '<td class="code-cell"></td>' : ''}
      ${p.cols.map(col=>`<td>${colTotal(p, col.id, conf.totalRows)}</td>`).join('')}
      <td>${parteGrandTotal(typeKey, p)}</td>
    </tr>`;

  // La fila TOTAL se inserta justo debajo del último concepto que suma
  // (conf.totalRows), salvo que el tipo pida explícitamente que vaya al final.
  const insertAt = conf.totalAtEnd ? conf.concepts.length : (conf.totalRows || conf.concepts).length;
  const bodyRows = bodyRowsArr.slice(0, insertAt).join('') + totalRowHtml + bodyRowsArr.slice(insertAt).join('');

  const colHeads = p.cols.map(col=>`
    <th>
      <div class="col-head-inner">
        <input type="date" data-colfecha="${col.id}" value="${col.fecha}" />
        <button class="col-del" data-delcol="${col.id}" title="Eliminar columna">✕</button>
      </div>
    </th>`).join('');

  return `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
      <div>
        <h2 class="view-title">${conf.label}</h2>
        <p class="view-sub" style="margin-bottom:0;">Los cambios se guardan automáticamente y se comparten en vivo.</p>
      </div>
      <button class="btn btn-ghost btn-sm" data-nav="${typeKey}">← Volver al listado</button>
    </div>

    <div class="editor-header">${headerFields}</div>

    <div class="table-wrap">
      <table class="parte-table">
        <thead><tr>
          <th class="concept-col">Concepto</th>
          ${conf.hasCode? '<th style="min-width:70px;">Código</th>' : ''}
          ${colHeads}
          <th>Total</th>
        </tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>

    <div class="editor-actions">
      <div style="display:flex;gap:10px;">
        <button class="btn btn-primary btn-sm" data-addcol="1">+ Añadir columna (fecha)</button>
        <button class="btn btn-ghost btn-sm" data-forcesave="${typeKey}">Guardar ahora</button>
        <button class="btn btn-danger btn-sm" data-delparte="${typeKey}|${p.id}">Eliminar parte</button>
      </div>
      <div class="save-note" id="save-note">Guardado ✓</div>
    </div>
  `;
}

function buildSheetForType(typeKey){
  const conf = TYPES[typeKey];
  const rows = [];
  STATE.data[typeKey].forEach(p=>{
    rows.push([conf.label]);
    const headerLine = [];
    conf.header.forEach(f=> headerLine.push(FIELD_LABELS[f]+': '+ (f==='fecha'? fmtDate(p[f]) : (p[f]||''))));
    rows.push(headerLine);
    rows.push([]);
    const head = ['Concepto']; if(conf.hasCode) head.push('Código');
    p.cols.forEach(c=>head.push(fmtDate(c.fecha)));
    head.push('Total');
    rows.push(head);
    const conceptRows = conf.concepts.map((concept, idx)=>{
      const r = [concept];
      if(conf.hasCode) r.push(conf.codeMap[idx].code);
      p.cols.forEach(col=> r.push(num(p.values[concept] && p.values[concept][col.id])));
      r.push(rowTotal(p, concept));
      return r;
    });
    const totalRow = ['TOTAL'];
    if(conf.hasCode) totalRow.push('');
    p.cols.forEach(col=> totalRow.push(colTotal(p, col.id, conf.totalRows)));
    totalRow.push(parteGrandTotal(typeKey, p));

    // El TOTAL se inserta justo debajo del último concepto que suma (conf.totalRows),
    // igual que en la tabla en vivo de la app (salvo que el tipo pida ir al final).
    const insertAt = conf.totalAtEnd ? conf.concepts.length : (conf.totalRows || conf.concepts).length;
    conceptRows.slice(0, insertAt).forEach(r=> rows.push(r));
    rows.push(totalRow);
    conceptRows.slice(insertAt).forEach(r=> rows.push(r));

    rows.push([]); rows.push([]);
  });
  if(rows.length===0) rows.push(['Sin partes registrados todavía.']);
  return XLSX.utils.aoa_to_sheet(rows);
}

let xlsxLoadingPromise = null;
function ensureXLSXLoaded(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadingPromise) return xlsxLoadingPromise;
  xlsxLoadingPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = ()=>resolve();
    s.onerror = ()=>{ xlsxLoadingPromise=null; reject(new Error('No se pudo cargar la librería de Excel')); };
    document.head.appendChild(s);
  });
  return xlsxLoadingPromise;
}

async function exportExcel(which, btnEl){
  const originalLabel = btnEl ? btnEl.textContent : null;
  if(btnEl){ btnEl.textContent = 'Preparando…'; btnEl.disabled = true; }
  try{
    await ensureXLSXLoaded();
  }catch(e){
    alert('No se ha podido cargar el generador de Excel. Comprueba tu conexión e inténtalo de nuevo.');
    if(btnEl){ btnEl.textContent = originalLabel; btnEl.disabled = false; }
    return;
  }
  const wb = XLSX.utils.book_new();
  if(which==='all'){
    Object.values(TYPES).forEach(conf=>{
      XLSX.utils.book_append_sheet(wb, buildSheetForType(conf.key), conf.short);
    });
  } else {
    XLSX.utils.book_append_sheet(wb, buildSheetForType(which), TYPES[which].short);
  }
  const fname = which==='all' ? 'control-barriles-completo.xlsx' : `control-barriles-${which}.xlsx`;
  XLSX.writeFile(wb, fname);
  if(btnEl){ btnEl.textContent = originalLabel; btnEl.disabled = false; }
}

/* ============================= HANDLERS ============================= */
function attachGlobalHandlers(){
  const logoutBtn = document.querySelector('[data-logout]');
  if(logoutBtn) logoutBtn.onclick = ()=>{
    flushPendingSaves();
    STATE.view = 'dashboard'; STATE.activeType = null; STATE.activeParteId = null;
    auth.signOut(); // onAuthStateChanged se encarga de limpiar y volver al login
    render();
  };

  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const id = el.getAttribute('data-nav');
      if(id==='dashboard'||id==='export'){ STATE.view=id; STATE.activeType=null; }
      else { STATE.view='list'; STATE.activeType=id; }
      render();
    };
  });

  document.querySelectorAll('[data-new]').forEach(el=>{
    el.onclick = ()=>{
      const typeKey = el.getAttribute('data-new');
      const p = newParte(typeKey);
      STATE.data[typeKey].push(p);
      saveParte(typeKey, p);
      STATE.view='editor'; STATE.activeType=typeKey; STATE.activeParteId=p.id;
      render();
    };
  });

  document.querySelectorAll('[data-open]').forEach(el=>{
    el.onclick = ()=>{
      const [typeKey, id] = el.getAttribute('data-open').split('|');
      STATE.view='editor'; STATE.activeType=typeKey; STATE.activeParteId=id;
      render();
    };
  });

  document.querySelectorAll('[data-export]').forEach(el=>{
    el.onclick = ()=> exportExcel(el.getAttribute('data-export'), el);
  });

  if(STATE.view==='editor'){
    const typeKey = STATE.activeType, p = getParte(typeKey, STATE.activeParteId);
    if(!p) return;

    document.querySelectorAll('[data-field]').forEach(el=>{
      el.onchange = ()=>{ p[field_ok(el)] = el.value; p.updatedAt=Date.now(); scheduleSave(typeKey, p); markSaving(); };
    });
    function field_ok(el){ return el.getAttribute('data-field'); }

    document.querySelectorAll('[data-cell]').forEach(el=>{
      el.oninput = ()=>{
        const [concept, colId] = el.getAttribute('data-cell').split('|');
        if(!p.values[concept]) p.values[concept]={};
        p.values[concept][colId] = el.value;
        p.updatedAt = Date.now();
        scheduleSave(typeKey, p);
        markSaving();
        updateTotalsInPlace(typeKey, p);
      };
    });

    document.querySelectorAll('[data-colfecha]').forEach(el=>{
      el.onchange = ()=>{
        const colId = el.getAttribute('data-colfecha');
        const col = p.cols.find(c=>c.id===colId);
        if(col){ col.fecha = el.value; p.updatedAt=Date.now(); scheduleSave(typeKey, p); markSaving(); }
      };
    });

    document.querySelectorAll('[data-delcol]').forEach(el=>{
      el.onclick = ()=>{
        const colId = el.getAttribute('data-delcol');
        if(p.cols.length<=1){ alert('El parte debe tener al menos una columna.'); return; }
        p.cols = p.cols.filter(c=>c.id!==colId);
        Object.keys(p.values).forEach(concept=>{ delete p.values[concept][colId]; });
        p.updatedAt=Date.now(); scheduleSave(typeKey, p);
        render();
      };
    });

    const addColBtn = document.querySelector('[data-addcol]');
    if(addColBtn) addColBtn.onclick = ()=>{
      p.cols.push({id:uid('col'), fecha:todayISO()});
      p.updatedAt=Date.now(); scheduleSave(typeKey, p);
      render();
    };

    const forceSaveBtn = document.querySelector('[data-forcesave]');
    if(forceSaveBtn) forceSaveBtn.onclick = ()=>{ clearTimeout(saveTimers[p.id]); saveTimers[p.id]=null; saveParte(typeKey, p); markSaving(); };

    const delParteBtn = document.querySelector('[data-delparte]');
    if(delParteBtn) delParteBtn.onclick = ()=>{
      if(!confirm('¿Eliminar este parte? Esta acción no se puede deshacer.')) return;
      const [tk,id] = delParteBtn.getAttribute('data-delparte').split('|');
      STATE.data[tk] = STATE.data[tk].filter(x=>x.id!==id);
      deleteParteRemote(tk, id);
      STATE.view='list'; STATE.activeParteId=null;
      render();
    };
  }
}

function markSaving(){
  const note = document.getElementById('save-note');
  if(!note) return;
  note.textContent = 'Guardando…';
  clearTimeout(window.__saveNoteTimer);
  window.__saveNoteTimer = setTimeout(()=>{ if(note) note.textContent='Guardado ✓'; }, 650);
}

function updateTotalsInPlace(typeKey, p){
  // Recompute only the total cells without a full re-render (keeps focus in the active input)
  const conf = TYPES[typeKey];
  let conceptIdx = 0;
  document.querySelectorAll('table.parte-table tbody tr').forEach(tr=>{
    if(tr.classList.contains('total-row')){
      const tds = tr.querySelectorAll('td');
      const offset = conf.hasCode ? 2 : 1; // 'TOTAL' label (+ código en blanco si aplica)
      p.cols.forEach((col,i)=>{ if(tds[i+offset]) tds[i+offset].textContent = colTotal(p, col.id, conf.totalRows); });
      if(tds[tds.length-1]) tds[tds.length-1].textContent = parteGrandTotal(typeKey, p);
      return;
    }
    if(conceptIdx < conf.concepts.length){
      const concept = conf.concepts[conceptIdx];
      const totalCell = tr.querySelector('.total-cell');
      if(totalCell) totalCell.textContent = rowTotal(p, concept);
      conceptIdx++;
    }
  });
}

/* ============================= INIT ============================= */
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) flushPendingSaves(); });
window.addEventListener('pagehide', flushPendingSaves);
window.addEventListener('beforeunload', flushPendingSaves);

auth.onAuthStateChanged(user=>{
  STATE.authChecked = true;
  if(user){
    STATE.authenticated = true;
    if(!Object.keys(unsubscribers).length) startListening();
  } else {
    STATE.authenticated = false;
    stopListening();
  }
  render();
});
</script>
