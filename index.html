function ObraBuscador({obras,value,onChange}){
  const [query,setQuery]=useState("");
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    const h=e=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false);};
    document.addEventListener("mousedown",h);document.addEventListener("touchstart",h);
    return()=>{document.removeEventListener("mousedown",h);document.removeEventListener("touchstart",h);};
  },[]);
  const ao=(obras||[]).filter(o=>o.active);
  const q=query.trim().toLowerCase();
  const filtered=q?ao.filter(o=>o.code.toLowerCase().includes(q)||o.name.toLowerCase().includes(q)):ao;
  const selected=ao.find(o=>o.code===value);
  const displayText=selected?selected.code+" - "+selected.name:"";
  const select=code=>{onChange(code);setQuery("");setOpen(false);};
  return html2`<div ref=${ref} style=${{position:"relative"}}>
    <input class="fi" value=${open?query:displayText}
      onInput=${e=>{setQuery(e.target.value);setOpen(true);}}
      onFocus=${()=>{setQuery("");setOpen(true);}}
      placeholder="Escribe para buscar obra..."
      autocomplete="off" autocorrect="off" autocapitalize="none"
      style=${{paddingRight:32}}/>
    <span style=${{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none",color:"#94a3b8"}}>[+]</span>
    ${open&&html2`<div style=${{position:"absolute",zIndex:1000,top:"calc(100% + 4px)",left:0,right:0,background:"#fff",border:"1.5px solid #1a3a5c",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,.15)",maxHeight:240,overflowY:"auto"}}>
      ${filtered.length===0?html2`<div style=${{padding:"12px 14px",color:"#94a3b8",fontSize:13}}>Sin resultados</div>`:
        filtered.map(o=>html2`<div key=${o.code}
          onMouseDown=${e=>{e.preventDefault();select(o.code);}}
          onTouchEnd=${e=>{e.preventDefault();select(o.code);}}
          style=${{padding:"10px 14px",cursor:"pointer",fontSize:13,borderBottom:"1px solid #f1f5f9",background:o.code===value?"#f0f9ff":"#fff"}}>
          <span style=${{fontWeight:700,color:"#1a3a5c",marginRight:8}}>${o.code}</span>
          <span style=${{color:"#6b7280"}}>${o.name}</span>
        </div>`)}
    </div>`}
  </div>`;
}

function Vehiculos({vehiculos,sV}){
  const [mat,setMat]=useState("");
  const [desc,setDesc]=useState("");
  const [err,setE]=useState("");
  const [ok,setOk]=useState("");
  const add=()=>{
    try{
      const m=mat.trim().toUpperCase().replace(/ /g,"");
      if(!m){setE("Introduce la matricula");return;}
      const lista=Array.isArray(vehiculos)?vehiculos:[];
      if(lista.find(v=>v.matricula===m)){setE("Esa matricula ya existe");return;}
      const nueva=[...lista,{matricula:m,descripcion:desc.trim(),activo:true}];
      sV(nueva).then(()=>{
        setMat("");setDesc("");setE("");setOk("Vehiculo anadido");setTimeout(()=>setOk(""),3000);
      }).catch(err=>{
        setE("Error al guardar: "+err.message);
      });
    }catch(err){
      setE("Error: "+err.message);
    }
  };
  return html2`<div class="pw" style=${{padding:"24px 20px",maxWidth:700}}>

      <div class="fg"><label class="lb">Descripcion (opcional)</label><input class="fi" value=${desc} onInput=${e=>setDesc(e.target.value)} placeholder="ej: Furgoneta blanca"/></div>

      ${ok&&html2`<p class="ok">${ok}</p>`}

      <h3 class="ctit">Vehiculos (${(vehiculos||[]).length})</h3>
      ${(vehiculos||[]).length===0?html2`<p class="em">Sin vehiculos. Anade el primero.</p>`:""}
      ${(vehiculos||[]).map(v=>html2`
        <div key=${v.matricula} style=${{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid #f1f5f9",gap:8,flexWrap:"wrap"}}>

            ${v.descripcion&&html2`<span style=${{fontSize:14,color:"#374151"}}>${v.descripcion}</span>`}

          <div style=${{display:"flex",gap:8,alignItems:"center",flexShrink:0}}>

            <button class="bw" onClick=${()=>{const nueva=(vehiculos||[]).map(x=>x.matricula===v.matricula?{...x,activo:!x.activo}:x);sV(nueva);}}>${v.activo?"Desactivar":"Activar"}</button>
            <button class="bd" onClick=${()=>{if(confirm("Eliminar "+v.matricula+"?")){const nueva=(vehiculos||[]).filter(x=>x.matricula!==v.matricula);sV(nueva);}}}>X</button>
          </div>
        </div>`)}
    </div>
  </div>`;
}

function CopyModal({parte,onClose,onCopy}){
  const [mes,setMes]=useState(parte.date.substring(0,7));
  const [sel,setSel]=useState([]);
  const [y,m]=mes.split("-").map(Number);
  const dias=new Date(y,m,0).getDate();
  const mnames=["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const todos=Array.from({length:dias},(_,i)=>{const d=String(i+1).padStart(2,"0");return y+"-"+String(m).padStart(2,"0")+"-"+d;}).filter(d=>d!==parte.date);
  const tog=d=>setSel(s=>s.includes(d)?s.filter(x=>x!==d):[...s,d]);
  const fd1=new Date(y,m-1,1).getDay();
  return html2`<div class="mb" onClick=${e=>{if(e.target===e.currentTarget)onClose();}}>
    <div class="md" style=${{maxWidth:420}}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <h3 style=${{fontSize:16,fontWeight:800,color:"#1a3a5c"}}>Copiar a otras fechas</h3>
        <button onClick=${onClose} style=${{border:"none",background:"#f1f5f9",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16}}>X</button>
      </div>
      <div class="fg"><label class="lb">Mes</label><input class="fi" type="month" value=${mes} onInput=${e=>{setMes(e.target.value);setSel([]);}} style=${{maxWidth:180}}/></div>
      <div style=${{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        <button class="bs" style=${{padding:"6px 12px",fontSize:12}} onClick=${()=>setSel(todos.filter(d=>{const dw=new Date(d).getDay();return dw!==0&&dw!==6;}))}>Laborables</button>
        <button class="bs" style=${{padding:"6px 12px",fontSize:12}} onClick=${()=>setSel([...todos])}>Todos</button>
        <button class="bd" style=${{padding:"6px 10px"}} onClick=${()=>setSel([])}>Limpiar</button>
      </div>
      <div style=${{textAlign:"center",fontWeight:700,color:"#1a3a5c",marginBottom:8}}>${mnames[m]} ${y}</div>
      <div style=${{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
        ${["D","L","M","X","J","V","S"].map(d=>html2`<div key=${d} style=${{textAlign:"center",fontSize:11,fontWeight:700,color:"#94a3b8"}}>${d}</div>`)}
      </div>
      <div style=${{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,marginBottom:14}}>
        ${Array.from({length:fd1}).map((_,i)=>html2`<div key=${"e"+i}/>`)}
        ${todos.map(fecha=>{
          const d=parseInt(fecha.split("-")[2]);
          const dw=new Date(fecha).getDay();
          const isSel=sel.includes(fecha);
          const isWe=dw===0||dw===6;
          return html2`<button key=${fecha} onClick=${()=>tog(fecha)} style=${{padding:"7px 0",borderRadius:7,border:"none",cursor:"pointer",fontSize:13,fontWeight:isSel?800:500,background:isSel?"#1a3a5c":isWe?"#f1f5f9":"#fff",color:isSel?"#fff":isWe?"#94a3b8":"#374151"}}>${d}</button>`;
        })}
      </div>
      <div style=${{padding:"9px 14px",background:sel.length?"#f0fdf4":"#f8fafc",borderRadius:8,marginBottom:14,fontSize:13,fontWeight:600,color:sel.length?"#15803d":"#94a3b8",textAlign:"center"}}>
        ${sel.length?sel.length+" dia"+(sel.length>1?"s":"")+" seleccionado"+(sel.length>1?"s":""):"Selecciona dias"}
      </div>
      <div style=${{display:"flex",gap:10}}>
        <button class="bs" style=${{flex:1,padding:12}} onClick=${onClose}>Cancelar</button>
        <button class="bp" style=${{flex:2,padding:12,opacity:sel.length?1:.4}} onClick=${()=>{onCopy(sel);onClose();}} disabled=${!sel.length}>Copiar</button>
      </div>
    </div>
  </div>`;
}

function MisPartes({partes,obras,sP,allP,users,sess,vehiculos}){
  const sorted=[...partes].sort((a,b)=>b.date.localeCompare(a.date));
  return html2`<div class="pw" style=${{padding:"24px 20px",maxWidth:700}}>
    <h2 class="pt">Mis Partes</h2>
    ${sorted.length===0?html2`<div class="cd"><p class="em">No tienes partes aun</p></div>`:
      sorted.map(p=>{
        const esDeCapataz=p.creadorCapataz&&p.worker!==sess.username||(p.participantes||[]).some(par=>par.worker===sess.username&&p.worker!==sess.username);
        const toArrP2=x=>!x?[]:Array.isArray(x)?x:Object.values(x).filter(v=>v&&typeof v==="object"); const esParticipante=toArrP2(p.participantes).some(par=>par.worker===sess.username);
        // Get entries: own if worker, or participante entries
        const entradas=esParticipante&&p.worker!==sess.username
          ?(p.participantes||[]).find(par=>par.worker===sess.username)?.entries||p.entries
          :p.entries;
        const parteVista={...p,entries:entradas};
        return html2`<div key=${p.id}>
          ${esDeCapataz&&html2`<div style=${{background:"#f0f9ff",borderRadius:8,padding:"5px 10px",marginBottom:4,fontSize:12,color:"#0369a1",fontWeight:600}}>
            Parte creado por encargado
          </div>`}
          <${ParteCard} p=${parteVista} obras=${obras} users=${users} vehiculos=${vehiculos}
            onDelete=${esDeCapataz?null:id=>sP((allP||[]).filter(x=>x.id!==id))}
            onCopy=${esDeCapataz?null:fechas=>{const n=fechas.map(f=>({...p,date:f,id:Date.now()+Math.random()}));sP([...(allP||[]),...n]);}}
            onEdit=${esDeCapataz?null:updated=>sP((allP||[]).map(x=>x.id===updated.id?updated:x))}
          />
        </div>`;
      })}
  </div>`;
}

function MisPartesCapataz({partes,obras,sP,allP,users,sess,vehiculos}){
  const [modal,setModal]=useState(null);
  // Partes donde el capataz es creador (parte.worker===sess.username O parte.creadorCapataz===sess.username)
  const toArrP3=x=>!x?[]:Array.isArray(x)?x:Object.values(x).filter(v=>v&&typeof v==="object");
  const misPartes=(partes||[]).filter(p=>p.worker===sess.username||p.creadorCapataz===sess.username);
  const sorted=[...misPartes].sort((a,b)=>b.date.localeCompare(a.date));

  const onSaveParte=(updated)=>{
    sP((allP||[]).map(x=>x.id===updated.id?updated:x));
  };

  const quitarParticipante=(parte,username)=>{
    const nuevos=(parte.participantes||[]).filter(p=>p.worker!==username);
    // Si el encargado se quita a si mismo, marcar creadorCapataz para mantener control
    let updatedParte={...parte,participantes:nuevos};
    if(username===sess.username){
      updatedParte={...updatedParte,creadorCapataz:sess.username,worker:null};
    }
    onSaveParte(updatedParte);
  };

  const quitarme=(parte)=>{
    // El encargado se quita del parte pero mantiene control
    const updatedParte={...parte,
      worker:null,
      creadorCapataz:sess.username,
      workerExcluido:sess.username
    };
    onSaveParte(updatedParte);
  };

  const volvermeParte=(parte)=>{
    const updatedParte={...parte,
      worker:sess.username,
      workerExcluido:undefined
    };
    onSaveParte(updatedParte);
  };

          <!-- Otros participantes -->
          ${participantes.map((par,i)=>{
            const w=(users||[]).find(u=>u.username===par.worker);

            const phE=(par.entries||[]).reduce((s,e)=>s+(e.horasExtra||0),0);
            return html2`<div key=${i} style=${{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #f1f5f9",flexWrap:"wrap",gap:4}}>
              <div style=${{display:"flex",alignItems:"center",gap:8}}>
                <span style=${{width:8,height:8,borderRadius:"50%",background:"#16a34a",display:"inline-block"}}/>
                <span style=${{fontSize:13,fontWeight:600,color:"#1e293b"}}>${w?w.name:par.worker}</span>
                <span class="bg2" style=${{background:"#dbeafe",color:"#1e40af",fontSize:10}}>${phO.toFixed(1)}h${phE>0?" + "+phE.toFixed(1)+"ext":""}</span>
              </div>
              <button class="bd" style=${{padding:"4px 10px",fontSize:11}} onClick=${()=>{if(confirm("Quitar a ${w?w.name:par.worker} del parte?"))quitarParticipante(p,par.worker);}}>Quitar</button>
            </div>`;
          })}

          ${participantes.length===0&&!estoyIncluido&&html2`<p style=${{fontSize:12,color:"#94a3b8",padding:"4px 0"}}>Sin trabajadores incluidos</p>`}
        </div>

        <!-- Botones accion -->
        <div style=${{display:"flex",gap:8,marginTop:10}}>
          <button onClick=${()=>setModal({type:"add",parte:p})} style=${{flex:1,padding:"9px",borderRadius:9,border:"1.5px dashed #1a3a5c",background:"#f0f9ff",color:"#1a3a5c",fontWeight:700,cursor:"pointer",fontSize:13}}>
            + Anadir trabajador
          </button>
          <button onClick=${()=>setModal({type:"copy",parte:p})} style=${{padding:"9px 14px",borderRadius:9,border:"1.5px solid #e2e8f0",background:"#fff",color:"#374151",fontWeight:700,cursor:"pointer",fontSize:13}}>
            Copiar
          </button>
        </div>
      </div>`;
    })}

    ${modal?.type==="add"&&html2`<${ModalAnadirTrabajador} parte=${modal.parte} users=${users} obras=${obras}
      onClose=${()=>setModal(null)}
      onSave=${(updated)=>{onSaveParte(updated);setModal(null);}}/>`}
    ${modal?.type==="edit"&&html2`<${ModalEditParte} parte=${modal.parte} obras=${obras} vehiculos=${vehiculos}
      onClose=${()=>setModal(null)}
      onSave=${(updated)=>{onSaveParte(updated);setModal(null);}}/>`}
    ${modal?.type==="pdf"&&html2`<${ModalFirmas} parte=${modal.parte} obras=${obras} users=${users}
      onClose=${()=>setModal(null)}/>`}
    ${modal?.type==="copy"&&html2`<${CopyModal} parte=${modal.parte}
      onClose=${()=>setModal(null)}
      onCopy=${fechas=>{const n=fechas.map(f=>({...modal.parte,date:f,id:Date.now()+Math.random(),participantes:[]}));sP([...(allP||[]),...n]);setModal(null);}}/>`}
  </div>`;
}

function ModalPDFSemanal({partes,obras,users,onClose}){
  const [obra,setObra]=useState("");
  const [desde,setDesde]=useState("");
  const [hasta,setHasta]=useState("");
  const [sigT,setSigT]=useState(null);
  const [sigC,setSigC]=useState(null);
  const [cliente,setCliente]=useState({nombre:"",direccion:"",telefono:""});
  const [step,setStep]=useState(1);
  const [err,setErr]=useState("");

  const ao=(obras||[]).filter(o=>o.active);

  // Get all partes for selected obra and date range
  const toArrR=x=>!x?[]:Array.isArray(x)?x:Object.values(x).filter(v=>v&&typeof v==="object");
  const partesObra=(partes||[]).filter(p=>{
    if(!p||!p.date)return false;
    if(desde&&p.date<desde)return false;
    if(hasta&&p.date>hasta)return false;
    const ents=p.entries||[];
    const partsEnt=toArrR(p.participantes).flatMap(par=>par.entries||[]);
    return [...ents,...partsEnt].some(e=>e.obra===obra);
  });

  const generarPDFSemanal=()=>{
    if(!obra){setErr("Selecciona una obra");return;}
    if(!desde||!hasta){setErr("Selecciona fecha inicio y fin");return;}
    if(partesObra.length===0){setErr("No hay partes para esa obra y periodo");return;}

    const{jsPDF}=window.jspdf;
    const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    const W=210,mg=15;let y=mg;

    // Header
    try{doc.addImage(LOGO,"PNG",mg,y,40,18,undefined,"FAST");}catch(e){}
    doc.setFontSize(8);doc.setTextColor(100);
    doc.text("PROYECTOS INSTALACIONES Y MANTENIMIENTOS ANDALUCES SA",W-mg,y+4,{align:"right"});
    y+=22;
    doc.setDrawColor(26,58,92);doc.setLineWidth(0.8);doc.line(mg,y,W-mg,y);y+=6;
    doc.setFontSize(15);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
    doc.text("PARTE SEMANAL DE TRABAJO",W/2,y,{align:"center"});y+=8;
    doc.setFontSize(9);doc.setTextColor(80);doc.setFont(undefined,"normal");
    doc.text("Periodo: "+fmt(desde)+" - "+fmt(hasta),W/2,y,{align:"center"});y+=10;

    // Cliente / Obra boxes
    const obraObj=(obras||[]).find(o=>o.code===obra);
    const col2=W/2+2;const boxH=28;
    doc.setFillColor(255,252,235);doc.setDrawColor(230,210,150);
    doc.roundedRect(mg,y,(W-mg*2)/2-2,boxH,2,2,"FD");
    doc.setFontSize(8);doc.setTextColor(130,80,0);doc.setFont(undefined,"bold");
    doc.text("CLIENTE",mg+4,y+6);
    doc.setFont(undefined,"normal");doc.setTextColor(50);
    if(cliente.nombre)doc.text(cliente.nombre,mg+4,y+12);
    if(cliente.direccion)doc.text(cliente.direccion,mg+4,y+18);
    if(cliente.telefono)doc.text("Tel: "+cliente.telefono,mg+4,y+24);
    doc.setFillColor(240,245,255);doc.setDrawColor(200,210,230);
    doc.roundedRect(col2,y,(W-mg*2)/2-2,boxH,2,2,"FD");
    doc.setFontSize(8);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
    doc.text("OBRA",col2+4,y+6);
    doc.setFont(undefined,"normal");doc.setTextColor(50);
    const obraLabel=obraObj?obra+" - "+obraObj.name:obra;
    const obraLines=doc.splitTextToSize(obraLabel,(W-mg*2)/2-10);
    doc.text(obraLines,col2+4,y+12);
    y+=boxH+8;

    // Table headers
    doc.setFontSize(9);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
    doc.text("DETALLE DE TRABAJOS",mg,y);y+=5;
    const cols=[38,22,16,14,14,14,12,8,8,8,8];
    const heads=["Trabajador","Fecha","Horario","H.Ord","H.Ext","H.Noc","Km","D","1/2D","C","G"];
    let cx=mg;const cX=[];cols.forEach(c=>{cX.push(cx);cx+=c;});
    doc.setFillColor(26,58,92);doc.setTextColor(255);
    doc.rect(mg,y,W-mg*2,7,"F");
    doc.setFontSize(7);doc.setFont(undefined,"bold");
    heads.forEach((h,i)=>{doc.text(h,cX[i]+1,y+5);});y+=7;

    let totHO=0,totHE=0,totHN=0,totKm=0,totD=0,totMD=0,totC=0,totG=0;
    let row=0;
    doc.setTextColor(30);doc.setFont(undefined,"normal");doc.setFontSize(7);

    // Sort partes by date
    const sorted=[...partesObra].sort((a,b)=>a.date.localeCompare(b.date));

    sorted.forEach(p=>{
      // Build list of workers for this parte
      const allW=[];
      if(p.worker){
        const u=(users||[]).find(u=>u.username===p.worker);
        const ents=(p.entries||[]).filter(e=>e.obra===obra);
        if(ents.length)allW.push({name:u?u.name:p.worker,entries:ents});
      }
      toArrR(p.participantes).forEach(par=>{
        const u=(users||[]).find(u=>u.username===par.worker);
        const ents=(par.entries||[]).filter(e=>e.obra===obra);
        if(ents.length)allW.push({name:u?u.name:par.worker,entries:ents});
      });

      allW.forEach(({name,entries})=>{
        const hO=entries.reduce((s,e)=>s+(e.horasOrdinarias||0),0);
        const hE=entries.reduce((s,e)=>s+(e.horasExtra||0),0);
        const hN=entries.reduce((s,e)=>s+(e.horasNocturnas||0),0);
        const km=entries.reduce((s,e)=>s+(parseFloat(e.km)||0),0);
        const d=entries.some(e=>e.dieta);
        const md=entries.some(e=>e.mediaDieta);
        const c=entries.some(e=>e.canasto);
        const g=entries.some(e=>e.guardia);
        const horario=entries[0]&&entries[0].horaEntrada?entries[0].horaEntrada+"-"+entries[entries.length-1].horaSalida:"-";
        if(row%2===0){doc.setFillColor(248,250,252);doc.rect(mg,y,W-mg*2,7,"F");}
        doc.text(name.substring(0,22),cX[0]+1,y+5);
        doc.text(fmt(p.date),cX[1]+1,y+5);
        doc.text(horario,cX[2]+1,y+5);
        doc.text(String(hO),cX[3]+1,y+5);
        doc.text(hE>0?String(hE):"-",cX[4]+1,y+5);
        doc.text(hN>0?String(hN.toFixed(1)):"-",cX[5]+1,y+5);
        doc.text(km>0?String(km.toFixed(0)):"-",cX[6]+1,y+5);
        doc.text(d?"Si":"-",cX[7]+1,y+5);
        doc.text(md?"Si":"-",cX[8]+1,y+5);
        doc.text(c?"Si":"-",cX[9]+1,y+5);
        doc.text(g?"Si":"-",cX[10]+1,y+5);
        totHO+=hO;totHE+=hE;totHN+=hN;totKm+=km;
        if(d)totD++;if(md)totMD++;if(c)totC++;if(g)totG++;
        y+=7;doc.setDrawColor(230);doc.line(mg,y,W-mg,y);row++;
        if(y>260){doc.addPage();y=mg;}
      });
    });

    // Totals row
    doc.setFillColor(26,58,92);doc.setTextColor(255);doc.setFont(undefined,"bold");
    doc.rect(mg,y,W-mg*2,7,"F");
    doc.text("TOTALES",cX[0]+1,y+5);
    doc.text(String(totHO),cX[3]+1,y+5);
    doc.text(totHE>0?String(totHE):"-",cX[4]+1,y+5);
    doc.text(totHN>0?String(totHN.toFixed(1)):"-",cX[5]+1,y+5);
    doc.text(totKm>0?String(totKm.toFixed(0)):"-",cX[6]+1,y+5);
    doc.text(String(totD),cX[7]+1,y+5);
    doc.text(String(totMD),cX[8]+1,y+5);
    doc.text(String(totC),cX[9]+1,y+5);
    doc.text(String(totG),cX[10]+1,y+5);
    y+=12;

    // Signatures
    if(y>220){doc.addPage();y=mg;}
    doc.setDrawColor(26,58,92);doc.setLineWidth(0.4);doc.line(mg,y,W-mg,y);y+=6;
    doc.setFontSize(10);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
    doc.text("FIRMAS",W/2,y,{align:"center"});y+=8;
    const sigW=(W-mg*2)/2-5;const sigH=35;const sig2x=mg+sigW+10;
    doc.setDrawColor(180);doc.setLineWidth(0.3);
    doc.roundedRect(mg,y,sigW,sigH,2,2);
    doc.setFontSize(7.5);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
    doc.text("FIRMA PIMASA",mg+sigW/2,y+5,{align:"center"});
    if(sigT){try{doc.addImage(sigT,"PNG",mg+4,y+7,sigW-8,sigH-12,undefined,"FAST");}catch(e){}}
    doc.roundedRect(sig2x,y,sigW,sigH,2,2);
    doc.setTextColor(130,80,0);doc.text("FIRMA DEL CLIENTE",sig2x+sigW/2,y+5,{align:"center"});
    if(sigC){try{doc.addImage(sigC,"PNG",sig2x+4,y+7,sigW-8,sigH-12,undefined,"FAST");}catch(e){}}
    doc.setFont(undefined,"normal");doc.setFontSize(7);doc.setTextColor(100);
    doc.text((cliente.nombre||"Cliente").substring(0,30),sig2x+sigW/2,y+sigH-3,{align:"center"});
    y+=sigH+6;
    doc.setFontSize(7);doc.setTextColor(120);
    doc.text("Documento generado - GestionObras Pro | PROYECTOS INSTALACIONES Y MANTENIMIENTOS ANDALUCES SA",W/2,y,{align:"center"});
    doc.save("parte_semanal_"+obra+"_"+desde+"_"+hasta+".pdf");
  };

  return html2`<div class="mb" onClick=${e=>{if(e.target===e.currentTarget)onClose();}}>
    <div class="md" style=${{maxWidth:600}}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h2 style=${{fontSize:17,fontWeight:800,color:"#1a3a5c"}}>PDF Semanal por Obra</h2>
        <button onClick=${onClose} style=${{border:"none",background:"#f1f5f9",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16}}>X</button>
      </div>
      <div style=${{display:"flex",gap:8,marginBottom:20}}>${[1,2,3].map(s=>html2`<div key=${s} style=${{flex:1,height:4,borderRadius:4,background:step>=s?"#1a3a5c":"#e2e8f0"}}/>`)}</div>

      ${step===1&&html2`<div>
        <div class="fg"><label class="lb">Obra</label>
          <${ObraBuscador} obras=${obras} value=${obra} onChange=${v=>setObra(v)}/>
        </div>
        <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          <div class="fg"><label class="lb">Desde</label><input class="fi" type="date" value=${desde} onInput=${e=>setDesde(e.target.value)}/></div>
          <div class="fg"><label class="lb">Hasta</label><input class="fi" type="date" value=${hasta} onInput=${e=>setHasta(e.target.value)}/></div>
        </div>
        ${obra&&desde&&hasta&&html2`<div style=${{padding:"10px 14px",background:partesObra.length?"#f0fdf4":"#fef2f2",borderRadius:8,fontSize:13,fontWeight:600,color:partesObra.length?"#15803d":"#dc2626"}}>
          ${partesObra.length?partesObra.length+" partes encontrados":"Sin partes para esa obra y periodo"}
        </div>`}
        ${err&&html2`<p class="er">${err}</p>`}
        <div style=${{display:"flex",gap:10,marginTop:16}}>
          <button class="bs" style=${{flex:1,padding:13}} onClick=${onClose}>Cancelar</button>
          <button class="bp" style=${{flex:2,padding:13}} onClick=${()=>{if(!obra||!desde||!hasta){setErr("Completa todos los campos");return;}if(!partesObra.length){setErr("No hay partes para esa obra y periodo");return;}setErr("");setStep(2);}}>Siguiente</button>
        </div>
      </div>`}

      ${step===2&&html2`<div>
        <div class="fg"><label class="lb">Nombre cliente</label><input class="fi" value=${cliente.nombre} onInput=${e=>setCliente({...cliente,nombre:e.target.value})} placeholder="Nombre del cliente"/></div>
        <div class="fg"><label class="lb">Direccion</label><input class="fi" value=${cliente.direccion} onInput=${e=>setCliente({...cliente,direccion:e.target.value})} placeholder="Calle, numero, ciudad"/></div>
        <div class="fg"><label class="lb">Telefono</label><input class="fi" type="tel" value=${cliente.telefono} onInput=${e=>setCliente({...cliente,telefono:e.target.value})} placeholder="000 000 000"/></div>
        <div style=${{display:"flex",gap:10,marginTop:16}}>
          <button class="bs" style=${{flex:1,padding:13}} onClick=${()=>setStep(1)}>Volver</button>
          <button class="bp" style=${{flex:2,padding:13}} onClick=${()=>setStep(3)}>Siguiente: Firmas</button>
        </div>
      </div>`}

      ${step===3&&html2`<div>
        <div style=${{marginBottom:20}}><label class="lb" style=${{marginBottom:10,display:"block"}}>Firma PIMASA</label><${SignaturePad} label="Firme aqui" onSign=${setSigT} signed=${!!sigT}/></div>
        <div style=${{marginBottom:20}}><label class="lb" style=${{marginBottom:10,display:"block"}}>Firma del cliente</label><${SignaturePad} label="Firme aqui" onSign=${setSigC} signed=${!!sigC}/></div>
        <div style=${{display:"flex",gap:10,marginTop:8}}>
          <button class="bs" style=${{flex:1,padding:12}} onClick=${()=>setStep(2)}>Volver</button>
          <button class="bp" style=${{flex:2,padding:12}} onClick=${generarPDFSemanal}>Generar PDF</button>
        </div>
      </div>`}
    </div>
  </div>`;
}


function TodosPartes({partes,obras,users,sP,vehiculos}){

        <div class="fg" style=${{marginBottom:0}}><label class="lb">Obra</label><select class="fi" value=${fo} onChange=${e=>setFo(e.target.value)}><option value="">Todas</option>${(obras||[]).map(o=>html2`<option key=${o.code} value=${o.code}>${o.code}</option>`)}</select></div>
        <div class="fg" style=${{marginBottom:0}}><label class="lb">Desde</label><input class="fi" type="date" value=${fd} onInput=${e=>setFd(e.target.value)}/></div>
        <div class="fg" style=${{marginBottom:0}}><label class="lb">Hasta</label><input class="fi" type="date" value=${ft} onInput=${e=>setFt(e.target.value)}/></div>
      </div>

    </div>
    ${fl.length===0?html2`<div class="cd"><p class="em">Sin partes</p></div>`:
      fl.map(p=>html2`<${ParteCard} key=${p.id} p=${p} obras=${obras} users=${users} vehiculos=${vehiculos}
        onDelete=${id=>sP((partes||[]).filter(x=>x.id!==id))}
        onCopy=${fechas=>{const n=fechas.map(f=>({...p,date:f,id:Date.now()+Math.random()}));sP([...(partes||[]),...n]);}}
        onEdit=${updated=>sP((partes||[]).map(x=>x.id===updated.id?updated:x))}

  ${pdfModal&&html2`<${ModalPDFSemanal} partes=${partes} obras=${obras} users=${users} onClose=${()=>setPdfModal(false)}/>`}
  </div>`;
}

function Excel({partes,obras,users}){
  const ws=(users||[]).filter(u=>u.role==="worker"||u.role==="capataz");
  const [df,setDf]=useState("");const [dt,setDt]=useState("");
  const now=new Date();
  const [nomMes,setNomMes]=useState(String(now.getMonth()+1).padStart(2,"0"));
  const [nomAnio,setNomAnio]=useState(String(now.getFullYear()));
  const fl=(partes||[]).filter(p=>(!df||p.date>=df)&&(!dt||p.date<=dt));
  const hO=fl.reduce((s,p)=>s+(p.entries||[]).reduce((ss,e)=>ss+(e.horasOrdinarias||0),0),0);
  const hE=fl.reduce((s,p)=>s+(p.entries||[]).reduce((ss,e)=>ss+(e.horasExtra||0),0),0);
  const km=fl.reduce((s,p)=>s+(p.entries||[]).reduce((ss,e)=>ss+(parseFloat(e.km)||0),0),0);
  const expW=()=>{
    if(!window.XLSX){alert("Espera");return;}
    const wb=window.XLSX.utils.book_new();
    const det=[["Trabajador","Fecha","Codigo","Obra","Entrada","Salida","H.Ord","H.Extra","H.Noc","Km","Dieta","1/2Dieta","Canasto","Guardia","Vehiculo","Observaciones","Materiales","Unidades"]];
    const toArrX=x=>!x?[]:Array.isArray(x)?x:Object.values(x).filter(v=>v&&typeof v==="object");
    fl.forEach(p=>{
      const vehicStr=p.vehiculos&&p.vehiculos.length?p.vehiculos.join(", "):p.vehiculo||"";
      // Main worker entries
      if(p.worker){
        const w=ws.find(u=>u.username===p.worker);
        (p.entries||[]).forEach(e=>{
          const o=(obras||[]).find(ob=>ob.code===e.obra);

function ResumenMensual({sess,partes}){
  const now=new Date();
  const [mes,setMes]=useState(String(now.getMonth()+1).padStart(2,"0"));
  const [anio,setAnio]=useState(String(now.getFullYear()));
  const mnames=["","Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  const toArrR=x=>!x?[]:Array.isArray(x)?x:Object.values(x).filter(v=>v&&typeof v==="object");

  // Filter partes for this worker in selected month
  const year=parseInt(anio),month=parseInt(mes);
  const misPartes=(partes||[]).filter(p=>{
    if(!p||!p.date)return false;
    const[y,m]=p.date.split("-").map(Number);
    if(y!==year||m!==month)return false;
    if(p.worker===sess.username)return true;
    return toArrR(p.participantes).some(par=>par.worker===sess.username);
  });

  // Get entries for this worker (own or as participante)
  const getEntries=p=>{
    if(p.worker===sess.username)return p.entries||[];
    const par=toArrR(p.participantes).find(par=>par.worker===sess.username);
    return par?par.entries||[]:[];
  };

  const allEntries=misPartes.flatMap(getEntries);

  // Calculations
  const hOrd=allEntries.reduce((s,e)=>s+(e.horasOrdinarias||0),0);
  const hExt=allEntries.reduce((s,e)=>s+(e.horasExtra||0),0);
  const hNoc=allEntries.reduce((s,e)=>s+(e.horasNocturnas||0),0);
  // km solo se cuentan cuando se usa vehiculo propio
  const esPropio=p=>{
    const vs=Array.isArray(p.vehiculos)?p.vehiculos:(p.vehiculo?[p.vehiculo]:[]);
    return vs.includes("PROPIO")||vs.length===0&&!p.vehiculo; // PROPIO o sin vehiculo (partes antiguos)
  };
  const km=misPartes.reduce((s,p)=>{
    if(!esPropio(p))return s;
    return s+getEntries(p).reduce((ss,e)=>ss+(parseFloat(e.km)||0),0);
  },0);
  const dietas=allEntries.filter(e=>e.dieta).length;
  const medias=allEntries.filter(e=>e.mediaDieta).length;
  const canastos=allEntries.filter(e=>e.canasto).length;
  const guardias=allEntries.filter(e=>e.guardia).length;
  const totalDias=misPartes.length;

  // Daily breakdown
  const diasMap={};
  misPartes.forEach(p=>{
    const ents=getEntries(p);
    const hO=ents.reduce((s,e)=>s+(e.horasOrdinarias||0),0);
    const hE=ents.reduce((s,e)=>s+(e.horasExtra||0),0);
    const hN=ents.reduce((s,e)=>s+(e.horasNocturnas||0),0);
    const k=ents.reduce((s,e)=>s+(parseFloat(e.km)||0),0);
    const d=ents.some(e=>e.dieta);
    const md=ents.some(e=>e.mediaDieta);
    const c=ents.some(e=>e.canasto);
    const g=ents.some(e=>e.guardia);
    diasMap[p.date]={hO,hE,hN,k,d,md,c,g,obras:[...new Set(ents.map(e=>e.obra))]};
  });
  const diasOrdenados=Object.entries(diasMap).sort((a,b)=>a[0].localeCompare(b[0]));

  return html2`<div class="pw" style=${{padding:"24px 20px",maxWidth:700}}>
    <h2 class="pt">Mi Resumen Mensual</h2>

    <!-- Selector mes/año -->
    <div class="cd" style=${{marginBottom:16}}>
      <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div class="fg" style=${{marginBottom:0}}>
          <label class="lb">Mes</label>
          <select class="fi" value=${mes} onChange=${e=>setMes(e.target.value)}>
            ${["01","02","03","04","05","06","07","08","09","10","11","12"].map((m,i)=>html2`<option key=${m} value=${m}>${mnames[i+1]}</option>`)}
          </select>
        </div>
        <div class="fg" style=${{marginBottom:0}}>
          <label class="lb">Año</label>
          <input class="fi" type="number" value=${anio} onInput=${e=>setAnio(e.target.value)} min="2024" max="2030"/>
        </div>
      </div>
    </div>

    ${misPartes.length===0?html2`<div class="cd"><p class="em">Sin partes en ${mnames[month]} ${year}</p></div>`:html2`

    <!-- Tarjetas resumen -->
    <div style=${{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:10,marginBottom:16}}>
      <div class="cd" style=${{borderTop:"4px solid #1a3a5c",marginBottom:0,textAlign:"center",padding:"14px 10px"}}>
        <div style=${{fontSize:26,fontWeight:900,color:"#1a3a5c"}}>${hOrd.toFixed(1)}h</div>
        <div style=${{fontSize:11,color:"#6b7280",marginTop:4,fontWeight:700,textTransform:"uppercase"}}>H. Ordinarias</div>
      </div>
      <div class="cd" style=${{borderTop:"4px solid #c2410c",marginBottom:0,textAlign:"center",padding:"14px 10px"}}>
        <div style=${{fontSize:26,fontWeight:900,color:"#c2410c"}}>${hExt.toFixed(1)}h</div>
        <div style=${{fontSize:11,color:"#6b7280",marginTop:4,fontWeight:700,textTransform:"uppercase"}}>H. Extra</div>
      </div>
      <div class="cd" style=${{borderTop:"4px solid #6d28d9",marginBottom:0,textAlign:"center",padding:"14px 10px"}}>
        <div style=${{fontSize:26,fontWeight:900,color:"#6d28d9"}}>${hNoc.toFixed(1)}h</div>
        <div style=${{fontSize:11,color:"#6b7280",marginTop:4,fontWeight:700,textTransform:"uppercase"}}>H. Nocturnas</div>
      </div>
      <div class="cd" style=${{borderTop:"4px solid #065f46",marginBottom:0,textAlign:"center",padding:"14px 10px"}}>
        <div style=${{fontSize:26,fontWeight:900,color:"#065f46"}}>${km.toFixed(0)}</div>
        <div style=${{fontSize:11,color:"#6b7280",marginTop:4,fontWeight:700,textTransform:"uppercase"}}>Km</div>
      </div>
    </div>

    <!-- Dietas y extras -->
    <div class="cd" style=${{marginBottom:16}}>
      <h3 class="ctit">Complementos del mes</h3>
      <div style=${{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}}>
        ${[[dietas,"Dietas","#fef3c7","#92400e"],[medias,"1/2 Dietas","#fef9c3","#713f12"],[canastos,"Canastos","#dcfce7","#15803d"],[guardias,"Guardias","#ede9fe","#6d28d9"]].map(([val,label,bg,color])=>html2`
          <div style=${{background:bg,borderRadius:10,padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style=${{fontSize:13,fontWeight:700,color}}>${label}</span>
            <span style=${{fontSize:22,fontWeight:900,color}}>${val}</span>
          </div>`)}
      </div>
    </div>

    <!-- Total dias -->

            <!-- Totales -->

  </div>`;
}


function MiCuenta({sess,users,sU}){
  const [pa,setPa]=useState("");const [pn,setPn]=useState("");const [pr,setPr]=useState("");
  const [nu,setNu]=useState("");const [pu,setPu]=useState("");
  const [okP,setOkP]=useState("");const [erP,setErP]=useState("");
  const [okU,setOkU]=useState("");const [erU,setErU]=useState("");
  const cambiarPass=()=>{
    setErP("");setOkP("");
    const user=(users||[]).find(u=>u.username===sess.username);
    if(!user){setErP("Error");return;}
    if(pa!==user.password){setErP("Contrasena actual incorrecta");return;}
    if(pn.length<4){setErP("Minimo 4 caracteres");return;}
    if(pn!==pr){setErP("Las contrasenas no coinciden");return;}
    sU((users||[]).map(u=>u.username===sess.username?{...u,password:pn}:u));
    setPa("");setPn("");setPr("");setOkP("Contrasena cambiada");setTimeout(()=>setOkP(""),4000);
  };
  const cambiarUser=()=>{
    setErU("");setOkU("");
    const user=(users||[]).find(u=>u.username===sess.username);
    if(!user){setErU("Error");return;}
    const nuevo=nu.trim().toLowerCase();
    if(nuevo.length<3){setErU("Minimo 3 caracteres");return;}
    if(!/^[a-z0-9._-]+$/.test(nuevo)){setErU("Solo letras, numeros, puntos y guiones");return;}
    if(pu!==user.password){setErU("Contrasena incorrecta");return;}
    if((users||[]).find(u=>u.username===nuevo&&u.username!==sess.username)){setErU("Ese usuario ya existe");return;}
    sU((users||[]).map(u=>u.username===sess.username?{...u,username:nuevo}:u));
    setNu("");setPu("");setOkU("Usuario cambiado. Inicia sesion de nuevo.");
    setTimeout(()=>window.location.reload(),2500);
  };
  return html2`<div class="pw" style=${{padding:"24px 20px",maxWidth:480}}>
    <h2 class="pt">Mi Cuenta</h2>
    <div class="cd" style=${{marginBottom:16}}>
      <h3 class="ctit">Datos actuales</h3>
      <div style=${{display:"flex",gap:16,flexWrap:"wrap"}}>
        <div style=${{flex:1}}><div class="lb" style=${{marginBottom:4}}>Nombre</div><div style=${{fontSize:15,fontWeight:700,color:"#1e293b"}}>${sess.name}</div></div>
        <div style=${{flex:1}}><div class="lb" style=${{marginBottom:4}}>Usuario</div><div style=${{fontSize:15,fontWeight:700,color:"#1a3a5c",fontFamily:"monospace"}}>${sess.username}</div></div>
      </div>
    </div>
    <div class="cd" style=${{marginBottom:16}}>
      <h3 class="ctit">Cambiar usuario</h3>
      <div class="fg"><label class="lb">Nuevo usuario</label><input class="fi" value=${nu} onInput=${e=>setNu(e.target.value.toLowerCase())} placeholder="ej: jgarcia" autocapitalize="none" autocorrect="off"/></div>
      <div class="fg"><label class="lb">Confirma con tu contrasena</label><input class="fi" type="password" value=${pu} onInput=${e=>setPu(e.target.value)}/></div>
      ${erU&&html2`<p class="er">${erU}</p>`}
      ${okU&&html2`<p class="ok">${okU}</p>`}
      <button class="bp" style=${{width:"100%",padding:13,marginTop:8}} onClick=${cambiarUser} disabled=${!nu||!pu}>Cambiar usuario</button>
    </div>
    <div class="cd">
      <h3 class="ctit">Cambiar contrasena</h3>
      <div class="fg"><label class="lb">Contrasena actual</label><input class="fi" type="password" value=${pa} onInput=${e=>setPa(e.target.value)}/></div>
      <div class="fg"><label class="lb">Nueva contrasena</label><input class="fi" type="password" value=${pn} onInput=${e=>setPn(e.target.value)}/></div>
      <div class="fg"><label class="lb">Repetir nueva</label><input class="fi" type="password" value=${pr} onInput=${e=>setPr(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&cambiarPass()}/></div>
      ${erP&&html2`<p class="er">${erP}</p>`}
      ${okP&&html2`<p class="ok">${okP}</p>`}
      <button class="bp" style=${{width:"100%",padding:13,marginTop:8}} onClick=${cambiarPass} disabled=${!pa||!pn||!pr}>Cambiar contrasena</button>
    </div>
  </div>`;
}

function SignaturePad({label,onSign,signed}){
  const canvasRef=useRef(null);
  const drawing=useRef(false);
  const lastPos=useRef({x:0,y:0});
  const getPos=(e,canvas)=>{const rect=canvas.getBoundingClientRect();const src=e.touches?e.touches[0]:e;return{x:(src.clientX-rect.left)*(canvas.width/rect.width),y:(src.clientY-rect.top)*(canvas.height/rect.height)};};
  const startDraw=e=>{e.preventDefault();drawing.current=true;lastPos.current=getPos(e,canvasRef.current);};
  const draw=e=>{e.preventDefault();if(!drawing.current)return;const canvas=canvasRef.current;const ctx=canvas.getContext("2d");const pos=getPos(e,canvas);ctx.strokeStyle="#1a3a5c";ctx.lineWidth=2.5;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(lastPos.current.x,lastPos.current.y);ctx.lineTo(pos.x,pos.y);ctx.stroke();lastPos.current=pos;};
  const endDraw=()=>{if(!drawing.current)return;drawing.current=false;onSign(canvasRef.current.toDataURL("image/png"));};
  const clear=()=>{canvasRef.current.getContext("2d").clearRect(0,0,500,150);onSign(null);};
  return html2`<div>
    <div class="sw"><canvas ref=${canvasRef} width="500" height="150" style=${{width:"100%",height:150}}
      onMouseDown=${startDraw} onMouseMove=${draw} onMouseUp=${endDraw} onMouseLeave=${endDraw}
      onTouchStart=${startDraw} onTouchMove=${draw} onTouchEnd=${endDraw}></canvas></div>
    <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:6}}>
      <span style=${{fontSize:11,color:"#94a3b8"}}>${label}</span>
      <div style=${{display:"flex",gap:8,alignItems:"center"}}>
        ${signed&&html2`<span style=${{fontSize:11,color:"#16a34a",fontWeight:700}}>Firmado</span>`}
        <button class="bd" style=${{padding:"4px 10px",fontSize:11}} onClick=${clear}>Borrar</button>
      </div>
    </div>
  </div>`;
}

function generarPDF(parte,obras,users,sigT,sigC,cliente){
  const{jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
  const W=210,mg=15;let y=mg;

  // ── Cabecera con logo ──────────────────────────────────
  try{doc.addImage(LOGO,"PNG",mg,y,40,18,undefined,"FAST");}catch(e){}
  doc.setFontSize(8);doc.setTextColor(100);
  doc.text("PROYECTOS INSTALACIONES Y MANTENIMIENTOS ANDALUCES SA",W-mg,y+4,{align:"right"});
  doc.text("Instalaciones Electricas",W-mg,y+9,{align:"right"});
  y+=22;
  doc.setDrawColor(26,58,92);doc.setLineWidth(0.8);doc.line(mg,y,W-mg,y);y+=6;
  doc.setFontSize(16);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
  doc.text("PARTE DE TRABAJO",W/2,y,{align:"center"});y+=8;
  doc.setFontSize(9);doc.setTextColor(80);doc.setFont(undefined,"normal");
  doc.text("Parte: PT-"+String(parte.id).slice(-6),mg,y);
  doc.text("Fecha: "+fmt(parte.date),W-mg,y,{align:"right"});y+=10;

  // ── Empresa y Obra ─────────────────────────────────────
  const obraObj=(obras||[]).find(o=>o.code===(parte.entries||[])[0]?.obra);
  const obrasCodes=[...new Set((parte.entries||[]).map(e=>e.obra))];
  const obrasNames=obrasCodes.map(c=>{const o=(obras||[]).find(ob=>ob.code===c);return o?c+" - "+o.name:c;}).join(", ");
  const col2=W/2+2;const boxH=32;

  // Box cliente (izquierda)
  doc.setFillColor(255,252,235);doc.setDrawColor(230,210,150);
  doc.roundedRect(mg,y,(W-mg*2)/2-2,boxH,2,2,"FD");
  doc.setFontSize(8);doc.setTextColor(130,80,0);doc.setFont(undefined,"bold");
  doc.text("CLIENTE",mg+4,y+6);
  doc.setFont(undefined,"normal");doc.setTextColor(50);
  if(cliente.nombre)doc.text(cliente.nombre,mg+4,y+12);
  if(cliente.direccion)doc.text(cliente.direccion,mg+4,y+18);
  if(cliente.telefono)doc.text("Tel: "+cliente.telefono,mg+4,y+24);

  // Box obra (derecha)
  doc.setFillColor(240,245,255);doc.setDrawColor(200,210,230);
  doc.roundedRect(col2,y,(W-mg*2)/2-2,boxH,2,2,"FD");
  doc.setFontSize(8);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
  doc.text("OBRA",col2+4,y+6);
  doc.setFont(undefined,"normal");doc.setTextColor(50);doc.setFontSize(8);
  const obraLabel=obraObj?obraObj.code+" - "+obraObj.name:obrasNames;
  const obraLines=doc.splitTextToSize(obraLabel,(W-mg*2)/2-10);
  doc.text(obraLines,col2+4,y+12);
  y+=boxH+8;

  // ── Tabla de trabajadores ──────────────────────────────
  // Build list: capataz + participantes
  const capataz=parte.worker?(users||[]).find(u=>u.username===parte.worker):null;
  const participantes=parte.participantes||[];
  const todosWorkers=[];
  if(capataz)todosWorkers.push({user:capataz,entries:parte.entries||[]});
  participantes.forEach(p=>{
    const u=(users||[]).find(u=>u.username===p.worker)||{name:p.worker,username:p.worker};
    todosWorkers.push({user:u,entries:p.entries||parte.entries||[]});
  });
  if(todosWorkers.length===0)todosWorkers.push({user:{name:parte.worker,username:parte.worker},entries:parte.entries||[]});

  doc.setFontSize(10);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
  doc.text("DETALLE POR TRABAJADOR",mg,y);y+=5;

  // Table headers
  const cols=[52,18,14,14,14,14,12,8,8,8];
  const heads=["Trabajador","Horario","H.Ord","H.Extra","H.Noc","Total","Km","Dieta","Cnst","Grd"];
  let cx=mg;const cX=[];cols.forEach(c=>{cX.push(cx);cx+=c;});
  doc.setFillColor(26,58,92);doc.setTextColor(255);
  doc.rect(mg,y,W-mg*2,7,"F");
  doc.setFontSize(7);doc.setFont(undefined,"bold");
  heads.forEach((h,i)=>{doc.text(h,cX[i]+1,y+5);});y+=7;

  // Rows per worker
  let sumHO=0,sumHE=0,sumHN=0,sumKm=0,sumD=0,sumMD=0,sumC=0,sumG=0;
  doc.setTextColor(30);doc.setFont(undefined,"normal");doc.setFontSize(7.5);
  todosWorkers.forEach((tw,wi)=>{
    const wName=(tw.user?.name||tw.user?.username||"").substring(0,28);
    const wEntries=tw.entries||[];
    const wHO=wEntries.reduce((s,e)=>s+(e.horasOrdinarias||0),0);
    const wHE=wEntries.reduce((s,e)=>s+(e.horasExtra||0),0);
    const wHN=wEntries.reduce((s,e)=>s+(e.horasNocturnas||0),0);
    const wKm=wEntries.reduce((s,e)=>s+(parseFloat(e.km)||0),0);
    const wD=wEntries.some(e=>e.dieta);
    const wMD=wEntries.some(e=>e.mediaDieta);
    const wC=wEntries.some(e=>e.canasto);
    const wG=wEntries.some(e=>e.guardia);
    const wTot=wHO+wHE;
    const horario=wEntries[0]&&wEntries[0].horaEntrada?wEntries[0].horaEntrada+"-"+wEntries[wEntries.length-1].horaSalida:"-";
    if(wi%2===0){doc.setFillColor(248,250,252);doc.rect(mg,y,W-mg*2,7,"F");}
    doc.text(wName,cX[0]+1,y+5);
    doc.text(horario,cX[1]+1,y+5);
    doc.text(String(wHO),cX[2]+1,y+5);
    doc.text(String(wHE),cX[3]+1,y+5);
    doc.text(String(wHN.toFixed(1)),cX[4]+1,y+5);
    doc.text(String(wTot.toFixed(1)),cX[5]+1,y+5);
    doc.text(String(wKm.toFixed(0)),cX[6]+1,y+5);
    doc.text(wD?"Si":wMD?"1/2":"No",cX[7]+1,y+5);
    doc.text(wC?"Si":"No",cX[8]+1,y+5);
    doc.text(wG?"Si":"No",cX[9]+1,y+5);
    sumHO+=wHO;sumHE+=wHE;sumHN+=wHN;sumKm+=wKm;
    if(wD)sumD++;if(wMD)sumMD++;if(wC)sumC++;if(wG)sumG++;
    y+=7;doc.setDrawColor(230);doc.line(mg,y,W-mg,y);
  });

  // Totals row
  doc.setFillColor(26,58,92);doc.setTextColor(255);doc.setFont(undefined,"bold");
  doc.rect(mg,y,W-mg*2,7,"F");
  doc.text("TOTALES",cX[0]+1,y+5);
  doc.text(String(sumHO),cX[2]+1,y+5);
  doc.text(String(sumHE),cX[3]+1,y+5);
  doc.text(String(sumHN.toFixed(1)),cX[4]+1,y+5);
  doc.text(String((sumHO+sumHE).toFixed(1)),cX[5]+1,y+5);
  doc.text(String(sumKm.toFixed(0)),cX[6]+1,y+5);
  doc.text(String(sumD),cX[7]+1,y+5);
  doc.text(String(sumC),cX[8]+1,y+5);
  doc.text(String(sumG),cX[9]+1,y+5);
  y+=10;

  // ── Materiales ─────────────────────────────────────────
  const todosMateriales=(parte.entries||[]).flatMap(e=>(e.materiales||[]).filter(m=>m.descripcion));
  if(todosMateriales.length>0){
    if(y>220){doc.addPage();y=mg;}
    doc.setFontSize(10);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
    doc.text("MATERIALES UTILIZADOS",mg,y);y+=5;
    doc.setFillColor(26,58,92);doc.setTextColor(255);
    doc.rect(mg,y,W-mg*2,7,"F");
    doc.setFontSize(7.5);doc.setFont(undefined,"bold");
    doc.text("Descripcion",mg+2,y+5);
    doc.text("Uds",W-mg-15,y+5,{align:"right"});
    y+=7;
    doc.setTextColor(30);doc.setFont(undefined,"normal");
    todosMateriales.forEach((m,i)=>{
      if(i%2===0){doc.setFillColor(248,250,252);doc.rect(mg,y,W-mg*2,6,"F");}
      doc.text(m.descripcion.substring(0,70),mg+2,y+4.5);
      doc.text(String(m.unidades||"-"),W-mg-2,y+4.5,{align:"right"});
      y+=6;doc.setDrawColor(230);doc.line(mg,y,W-mg,y);
    });
    y+=5;
  }

  // ── Observaciones ──────────────────────────────────────
  const obsArr=(parte.entries||[]).filter(e=>e.observaciones);
  if(obsArr.length>0){
    if(y>220){doc.addPage();y=mg;}
    doc.setFontSize(9);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
    doc.text("OBSERVACIONES",mg,y);y+=5;
    doc.setFont(undefined,"normal");doc.setFontSize(8);doc.setTextColor(60);
    obsArr.forEach(e=>{
      const ob=(obras||[]).find(o=>o.code===e.obra);
      const label=(ob?e.obra+" - "+ob.name.substring(0,20):e.obra)+": ";
      const lines=doc.splitTextToSize(label+e.observaciones,W-mg*2);
      doc.text(lines,mg,y);y+=lines.length*4+3;
    });
    y+=3;
  }

  // ── Firmas ─────────────────────────────────────────────
  if(y>220){doc.addPage();y=mg;}
  y+=4;doc.setDrawColor(26,58,92);doc.setLineWidth(0.4);doc.line(mg,y,W-mg,y);y+=6;
  doc.setFontSize(10);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
  doc.text("FIRMAS",W/2,y,{align:"center"});y+=8;
  const sigW=(W-mg*2)/2-5;const sigH=35;const sig2x=mg+sigW+10;
  doc.setDrawColor(180);doc.setLineWidth(0.3);
  doc.roundedRect(mg,y,sigW,sigH,2,2);
  doc.setFontSize(7.5);doc.setTextColor(26,58,92);doc.setFont(undefined,"bold");
  doc.text("FIRMA DEL TRABAJADOR",mg+sigW/2,y+5,{align:"center"});
  if(sigT){try{doc.addImage(sigT,"PNG",mg+4,y+7,sigW-8,sigH-12,undefined,"FAST");}catch(e){}}
  doc.setFont(undefined,"normal");doc.setFontSize(7);doc.setTextColor(100);
  const workerName=capataz?capataz.name:(parte.worker||"");
  doc.text(workerName.substring(0,30),mg+sigW/2,y+sigH-3,{align:"center"});
  doc.roundedRect(sig2x,y,sigW,sigH,2,2);
  doc.setFontSize(7.5);doc.setTextColor(130,80,0);doc.setFont(undefined,"bold");
  doc.text("FIRMA DEL CLIENTE",sig2x+sigW/2,y+5,{align:"center"});
  if(sigC){try{doc.addImage(sigC,"PNG",sig2x+4,y+7,sigW-8,sigH-12,undefined,"FAST");}catch(e){}}
  doc.setFont(undefined,"normal");doc.setFontSize(7);doc.setTextColor(100);
  doc.text((cliente.nombre||"Cliente").substring(0,30),sig2x+sigW/2,y+sigH-3,{align:"center"});
  y+=sigH+8;
  doc.setDrawColor(26,58,92);doc.setLineWidth(0.4);doc.line(mg,y,W-mg,y);y+=4;
  doc.setFontSize(7);doc.setTextColor(120);
  doc.text("Documento generado - GestionObras Pro | PROYECTOS INSTALACIONES Y MANTENIMIENTOS ANDALUCES SA",W/2,y,{align:"center"});
  doc.save("parte_"+parte.id+"_"+parte.date+".pdf");
}

function ModalAnadirTrabajador({parte,users,obras,onClose,onSave}){
  const workers=(users||[]).filter(u=>u.role==="worker"||u.role==="capataz");
  const participantes=parte.participantes||[];
  const disponibles=workers.filter(w=>w.username!==parte.worker&&!participantes.find(p=>p.worker===w.username));
  const [sel,setSel]=useState("");
  const [ents,setEnts]=useState((parte.entries||[]).map(e=>({...e})));
  const [err,setErr]=useState("");
  const updEnt=(i,f,v)=>{
    const e=[...ents];e[i]={...e[i],[f]:v};
    if(f==="horaEntrada"||f==="horaSalida"){
      const ei=e[i];const h1=f==="horaEntrada"?v:ei.horaEntrada;const h2=f==="horaSalida"?v:ei.horaSalida;
      if(h1&&h2){
        const[hh,mm]=h1.split(":").map(Number);const[hs,ms]=h2.split(":").map(Number);
        let min=(hs*60+ms)-(hh*60+mm);if(min<0)min+=1440;
        const tot=min/60;let noc=0,cur=hh*60+mm;
        for(let t=cur;t<cur+min;t++){const tt=t%1440;if(tt>=1320||tt<360)noc+=1/60;}
        e[i].totalHoras=Math.round(tot*100)/100;e[i].horasNocturnas=Math.round(noc*100)/100;
        let rem=Math.min(e.reduce((s,x)=>s+(x.totalHoras||0),0),8);
        e.forEach((x,j)=>{const h=x.totalHoras||0;const ord=Math.min(h,rem);rem=Math.max(rem-ord,0);e[j].horasOrdinarias=Math.round(ord*100)/100;e[j].horasExtra=Math.round(Math.max(h-ord,0)*100)/100;});
      }
    }
    if(f==="dieta"&&v)e[i].mediaDieta=false;if(f==="mediaDieta"&&v)e[i].dieta=false;
    setEnts(e);
  };
  const confirmar=()=>{
    if(!sel){setErr("Selecciona un trabajador");return;}
    const nuevosParticipantes=[...participantes,{worker:sel,entries:ents}];
    onSave({...parte,participantes:nuevosParticipantes});
    onClose();
  };
  return html2`<div class="mb" onClick=${e=>{if(e.target===e.currentTarget)onClose();}}>
    <div class="md" style=${{maxWidth:520}}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <h3 style=${{fontSize:16,fontWeight:800,color:"#1a3a5c"}}>Anadir trabajador al parte</h3>
        <button onClick=${onClose} style=${{border:"none",background:"#f1f5f9",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:16}}>X</button>
      </div>
      <div class="fg"><label class="lb">Trabajador a anadir</label>
        <select class="fi" value=${sel} onChange=${e=>setSel(e.target.value)}>
          <option value="">Selecciona un trabajador</option>
          ${disponibles.map(w=>html2`<option key=${w.username} value=${w.username}>${w.name}</option>`)}
        </select>
      </div>
      ${disponibles.length===0&&html2`<p class="er">Todos los trabajadores ya estan en este parte</p>`}
      <div style=${{fontWeight:700,color:"#374151",fontSize:14,marginBottom:10}}>Datos (puedes modificarlos):</div>
      ${ents.map((en,i)=>{
        const ob=(obras||[]).find(o=>o.code===en.obra);
        return html2`<div key=${i} class="ec" style=${{marginBottom:10}}>
          <div style=${{fontWeight:700,color:"#1a3a5c",fontSize:13,marginBottom:8}}>
            <span class="ct">${en.obra}</span>
            <span style=${{marginLeft:8,color:"#6b7280",fontWeight:400,fontSize:12}}>${ob?ob.name:""}</span>
          </div>
          <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>
            <div class="fg" style=${{marginBottom:0}}><label class="lb">Entrada</label><input class="fi" type="time" value=${en.horaEntrada||""} onInput=${e=>updEnt(i,"horaEntrada",e.target.value)}/></div>
            <div class="fg" style=${{marginBottom:0}}><label class="lb">Salida</label><input class="fi" type="time" value=${en.horaSalida||""} onInput=${e=>updEnt(i,"horaSalida",e.target.value)}/></div>
            <div class="fg" style=${{marginBottom:0}}><label class="lb">Km</label><input class="fi" type="number" min="0" value=${en.km||""} onInput=${e=>updEnt(i,"km",e.target.value)} placeholder="0"/></div>
          </div>
          <div style=${{display:"flex",gap:10,marginTop:8,flexWrap:"wrap"}}>
            ${[["dieta","Dieta"],["mediaDieta","1/2 Dieta"],["canasto","Canasto"],["guardia","Guardia"]].map(([f,l])=>html2`
              <label key=${f} style=${{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer",background:"#f8fafc",padding:"5px 10px",borderRadius:8,border:"1px solid #e2e8f0"}}>
                <input type="checkbox" style=${{width:16,height:16,accentColor:"#1a3a5c"}} checked=${!!en[f]} onChange=${e=>updEnt(i,f,e.target.checked)}/>${l}
              </label>`)}
          </div>
        </div>`;
      })}
      ${err&&html2`<p class="er">${err}</p>`}
      <div style=${{display:"flex",gap:10,marginTop:12}}>
        <button class="bs" style=${{flex:1,padding:12}} onClick=${onClose}>Cancelar</button>
        <button class="bp" style=${{flex:2,padding:12}} onClick=${confirmar} disabled=${!sel||disponibles.length===0}>Anadir al parte</button>
      </div>
    </div>
  </div>`;
}


// Mount app
render(html2`<${App}/>`, document.getElementById("root"));

</script>

<script>
(function(){
  if("serviceWorker" in navigator){
    var sw='self.addEventListener("install",e=>{self.skipWaiting();});self.addEventListener("activate",e=>{self.clients.claim();});self.addEventListener("fetch",e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));});';
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:"text/javascript"}))).catch(function(){});
  }
})();
</script>
</body>
</html>
